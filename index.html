<script>
// Bắt mọi lỗi giao diện và hiện ra màn hình (để không bị trang trắng)
window.onerror = function (m, src, dong, cot) {
  var d = document.getElementById('main');
  var t = 'Lỗi giao diện: ' + m + (dong ? ' (dòng ' + dong + ':' + cot + ')' : '');
  if (d) d.innerHTML = '<div style="background:#fdecea;color:#c0392b;padding:12px;border-radius:8px;margin:12px 0">' + t + '<br><small>Chụp màn hình này gửi người phụ trách app.</small></div>';
  else window.__loi = t;
};
window.addEventListener('unhandledrejection', function (e) { window.onerror((e.reason && e.reason.message) || String(e.reason)); });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--g:#1f7a4d;--g2:#e7f3ec;--bd:#d9e2dc;--tx:#1d2a23;--mu:#6b7a71;--red:#c0392b;--red2:#fdecea;--or:#c77700;--or2:#fff4e0;--bg:#f4f7f5;--h:40px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
#app{max-width:980px;margin:0 auto;min-height:100vh;padding-bottom:70px}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;height:52px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{background:none;border:0;color:#fff;font-size:28px;width:32px;height:40px;cursor:pointer;visibility:hidden}
#who{font-size:12px;opacity:.85;white-space:nowrap}
#gpsPill{display:none;border:0;border-radius:14px;height:28px;padding:0 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
#hdPill{display:none;border:0;border-radius:14px;height:28px;padding:0 10px;font-size:12px;font-weight:600;cursor:pointer;background:#fff4e0;color:#8a5a00;white-space:nowrap}
#gpsPill.on{background:#d6f5e3;color:#14643c}#gpsPill.wait{background:#fff4e0;color:#8a5a00}#gpsPill.off{background:#fdecea;color:#c0392b}
main{padding:12px 16px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:center}
nav button{flex:1;max-width:160px;background:none;border:0;padding:6px 0 8px;font-size:11px;color:var(--mu);cursor:pointer}
nav button span{display:block;font-size:20px;line-height:24px}
nav button.on{color:var(--g);font-weight:600}
h3{font-size:15px;margin:18px 0 8px}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.muted{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.sb{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{height:var(--h);padding:0 14px;border-radius:8px;border:1px solid var(--g);background:var(--g);color:#fff;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn-o{background:#fff;color:var(--g)}
.btn-r{background:var(--red);border-color:var(--red)}
.btn-ro{background:#fff;color:var(--red);border-color:var(--red)}
.btn-s{height:32px;padding:0 10px;font-size:13px}
.btn-block{width:100%;margin-bottom:10px}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;height:var(--h);border:1px solid var(--bd);border-radius:8px;padding:0 10px;font-size:15px;background:#fff;color:var(--tx)}
textarea{height:auto;min-height:72px;padding:8px 10px}
input[type=checkbox]{width:18px;height:18px;margin:0}
.fld{margin-bottom:12px}
.fld>label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--bd);background:#fff;font-size:13px;cursor:pointer;color:var(--tx)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.list .item,.item{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;cursor:pointer}
.chev{color:var(--mu);font-size:22px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:10px;background:#eef1ef;color:var(--mu);white-space:nowrap}
.t-ok{background:var(--g2);color:var(--g)}
.t-bad{background:var(--red2);color:var(--red)}
.t-warn{background:var(--or2);color:var(--or)}
.ph{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.ph div{position:relative}
.ph img,.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:6px;border:1px solid var(--bd);display:block}
.ph b{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;font-size:12px;cursor:pointer}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px}
.stat b{display:block;font-size:20px}
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--bd);border-radius:10px;margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f0f5f2;white-space:nowrap;position:sticky;top:0}
td.c,th.c{text-align:center}
.lich td{padding:0;text-align:center;min-width:30px;height:32px;cursor:default;border-left:1px solid #eef1ef}
.lich td.k{text-align:left;padding:4px 8px;white-space:nowrap;position:sticky;left:0;background:#fff;z-index:1;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.lich th{padding:4px 2px;text-align:center;font-weight:500}
.lich .cn{background:#f3f3f3}
.lich td.ed{cursor:pointer}
.lich td span{font-size:11px;font-weight:700;letter-spacing:.5px}
.cK{color:var(--g)}.cP{color:var(--red)}.cS{color:var(--or)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tabs button{flex:0 0 auto;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--g);background:#fff;color:var(--g);font-size:13px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--g);color:#fff}
.seg{display:flex;border:1px solid var(--g);border-radius:8px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;height:36px;border:0;background:#fff;color:var(--g);font-size:13px;cursor:pointer}
.seg button.on{background:var(--g);color:#fff}
.timeline{font-size:13px;white-space:pre-line;color:var(--mu)}
.badge{font-size:12px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.alert{border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px;background:var(--or2);color:#7a4a00}
.alert.err{background:var(--red2);color:var(--red)}
.alert.ok{background:var(--g2);color:var(--g)}
details{background:#fff;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px}
details summary{padding:10px 12px;cursor:pointer;font-weight:600;font-size:14px}
details .in{padding:0 12px 10px;font-size:13px}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.55);display:none;align-items:center;justify-content:center;z-index:20}
#loading div{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px 18px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#263b30;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;display:none;max-width:90%;text-align:center}
#toast.err{background:var(--red)}
.login{max-width:360px;margin:60px auto;padding:0 16px}
.login h2{color:var(--g);text-align:center;margin-bottom:4px}
#sync{display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:xoay .8s linear infinite;flex:0 0 14px}
@keyframes xoay{to{transform:rotate(360deg)}}
#who{display:none;background:#fdecea;color:#c0392b;border-radius:14px;padding:5px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.logo{text-align:center;font-size:34px;margin-bottom:4px}
.big{height:52px;font-size:16px;border-radius:12px;font-weight:600}
.userbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ava{width:42px;height:42px;border-radius:50%;background:var(--g2);color:var(--g);display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 42px}
.step{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.step.need{border-color:#e7a29a;box-shadow:0 0 0 3px var(--red2)}
.step.done{border-color:#bfe3cc}

<script>
/* ====== ĐỊA CHỈ MÁY CHỦ: dán link /exec của Apps Script vào giữa hai dấu nháy ====== */
const API = 'https://script.google.com/macros/s/AKfycbxscAunxFrnPKsdeUQPj-mvg0VG3Kn5TZW0oTruacvSvx8dMYjIA7_T-DsymGhKb5WCzw/exec';
/* ================================================================================== */
const YC_PARAM = (() => { try { return (new URLSearchParams(location.search).get('yc') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 30); } catch (e) { return ''; } })();
let YC_CHO = YC_PARAM;
const QR_PARAM = (() => { try { return (new URLSearchParams(location.search).get('t') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 30); } catch (e) { return ''; } })();

/* ---------------- tiện ích ---------------- */
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let TOKEN = LS.get('kct_token') || '';
const TOC_DO = [];
let LOI_MANG = false, OFFLINE = false;
let LOI_CUOI = '', LECH_GIO = 0, GPS_LOI = null, GPS_WATCH = null;
let PH_CU = {};
let APP = null, CUR = null, STACK = [], PH = {}, F = {}, GPS = null, WM = '', QR_CHO = QR_PARAM, BUSY = 0;
const $ = s => document.querySelector(s);
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const q = k => !!(APP && APP.user.quyen[k]);
const dmy = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '';
const dm = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
const hm = s => s ? s.slice(11, 16) + ' ' + dm(s) : '';
const tien = n => Number(n || 0).toLocaleString('vi-VN') + ' đ';
const thangNay = () => APP.homNay.slice(0, 7);
const tenKhu = ma => { const k = APP.khu.find(x => x.ma === ma); return k ? k.ten : ma; };

function busy(on) { BUSY += on ? 1 : -1; if (BUSY < 0) BUSY = 0; $('#loading').style.display = BUSY ? 'flex' : 'none'; }
function toast(m, t) { const e = $('#toast'); e.textContent = m; e.className = t || ''; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', t === 'err' ? 5000 : 2800); }
async function call(a, p, quiet, imLang) {
  if (!quiet) busy(true);
  LOI_MANG = false;
  try {
    const ctl = window.AbortController ? new AbortController() : null;
    const hen = setTimeout(() => ctl && ctl.abort(), 45000);
    const t0 = Date.now();
    let res;
    try { res = await fetch(API, { method: 'POST', body: JSON.stringify({ token: TOKEN, action: a, p: p || {} }), signal: ctl ? ctl.signal : undefined }); }
    finally { clearTimeout(hen); }
    TOC_DO.push({ a, giay: (Date.now() - t0) / 1000 }); if (TOC_DO.length > 20) TOC_DO.shift();
    let j;
    try { j = await res.json(); } catch (e) { throw new Error('Máy chủ trả về dữ liệu lạ – kiểm tra link /exec và quyền truy cập "Bất kỳ ai" khi triển khai'); }
    if (OFFLINE) { OFFLINE = false; setTimeout(veMang, 0); }
    if (j.loi) throw new Error(j.loi);
    return j.kq;
  } catch (e) {
    let m = (e && e.message) || String(e);
    if (e && e.name === 'AbortError') { m = 'Máy chủ không phản hồi sau 45 giây – mạng yếu hoặc máy chủ đang bận'; LOI_MANG = true; }
    else if (/Failed to fetch|NetworkError|Load failed|network|internet/i.test(m) || navigator.onLine === false) { m = 'Không kết nối được máy chủ – đang mất mạng hoặc sóng yếu'; LOI_MANG = true; }
    LOI_CUOI = m;
    if (LOI_MANG && APP && !OFFLINE) { OFFLINE = true; setTimeout(veMang, 0); }
    if (/đăng nhập lại/.test(m)) { TOKEN = ''; LS.del('kct_token'); renderLogin(); }
    if (!imLang) toast(m, 'err');
    return null;
  } finally {
    if (!quiet) busy(false);
  }
}
function main(html) { $('#main').innerHTML = html; }
function setTitle(t) { $('#title').textContent = t; }
function thumbs(ids) {
  if (!ids) return '';
  return '<div class="thumbs">' + String(ids).split(',').filter(Boolean).map(id =>
    `<a href="https://drive.google.com/file/d/${h(id)}/view" target="_blank"><img loading="lazy" src="https://drive.google.com/thumbnail?id=${h(id)}&sz=w320"></a>`).join('') + '</div>';
}

/* ---------------- điều hướng ---------------- */
const PHIEN_BAN = '03/11/2026 (e)';
const PAGES = {};
let NAV_ON = 'home', BADGE_YC = 0, DD_TIEP = null;
function go(fn, args, push = true) {
  dungQuet();
  if (push && CUR) STACK.push(CUR);
  CUR = { fn, args: args || [] };
  window.scrollTo(0, 0);
  PAGES[fn](...CUR.args);
  $('#back').style.visibility = STACK.length ? 'visible' : 'hidden';
}
function goBack() {
  dungQuet();
  const p = STACK.pop();
  if (!p) return tab(dauTab());
  CUR = p; window.scrollTo(0, 0); PAGES[p.fn](...p.args);
  $('#back').style.visibility = STACK.length ? 'visible' : 'hidden';
}
function tab(n) { STACK = []; CUR = null; renderNav(n); go(n, [], false); }
function laNCC() { return !!(APP && APP.user.donVi === 'NCC'); }
/** Quyền theo tab: '' (ẩn) · 'xem' · 'sua' */
function qt(t) { const m = APP && APP.user.tab; if (!m) return 'xem'; return m[t] || ''; }
const NAV_DEF = [['home', '🧰', 'Công việc', 'CongViec'], ['lich', '📅', 'Lịch', 'Lich'], ['khu', '📍', 'Khu vực', 'KhuVuc'], ['baoCao', '📊', 'Báo cáo', 'BaoCao'], ['more', '⚙', 'Cài đặt', '']];
function navItems() { return NAV_DEF.filter(x => !x[3] || qt(x[3])); }
function dauTab() { return navItems()[0][0]; }
function trongNav(n) { return navItems().some(x => x[0] === n); }
function renderNav(on) {
  if (on) NAV_ON = on;
  if (!APP) { $('#nav').innerHTML = ''; return; }
  $('#nav').innerHTML = navItems().map(i => `<button class="${i[0] === NAV_ON ? 'on' : ''}" onclick="tab('${i[0]}')"><span>${i[1]}</span>${i[2]}${i[0] === 'home' && BADGE_YC ? `<em class="nbadge">${BADGE_YC}</em>` : ''}</button>`).join('');
}

/* ---------------- bộ nhớ tạm trong máy: hiện ngay dữ liệu lần trước, cập nhật sau ---------------- */
let DONG_BO = 0;
function dongBo(n) { DONG_BO = Math.max(0, DONG_BO + n); const e = $('#sync'); if (e) e.style.display = DONG_BO ? 'inline-block' : 'none'; }
function ckey(k) { return 'kct_c_' + (APP ? APP.user.ten : '') + '_' + k; }
function cGet(k) { try { return JSON.parse(LS.get(ckey(k)) || 'null'); } catch (e) { return null; } }
function cSet(k, v) {
  try {
    const kk = ckey(k);
    LS.set(kk, JSON.stringify(v));
    let ds = []; try { ds = JSON.parse(LS.get('kct_ckeys') || '[]'); } catch (e) {}
    ds = ds.filter(x => x !== kk); ds.push(kk);
    while (ds.length > 25) LS.del(ds.shift());
    LS.set('kct_ckeys', JSON.stringify(ds));
  } catch (e) { /* bộ nhớ đầy */ }
}
/** Hiện dữ liệu đã lưu trong máy ngay lập tức, rồi lấy bản mới từ máy chủ và vẽ lại */
async function taiNhanh(k, action, p, ve) {
  const me = CUR, c = cGet(k);
  if (c) ve(c, true);
  if (OFFLINE) { if (!c) ve(null, true); return; }
  dongBo(1);
  const r = await call(action, p, true, true);
  dongBo(-1);
  if (me !== CUR) return;
  if (r) { cSet(k, r); ve(r, false); }
  else if (!c) ve(null, false);
  else if (!LOI_MANG) toast(LOI_CUOI, 'err');
}
/* ---------------- tải trước ngầm: chuyển tab hiện ngay, không phải chờ ---------------- */
async function taiTruoc() {
  if (!APP || OFFLINE || document.hidden) return;
  const th = homStr().slice(0, 7), viec = [];
  if (qt('CongViec')) viec.push(['yc_mo', 'dsYeuCau', { loc: 'mo' }]);
  if (qt('Lich')) viec.push(['lich_' + th, 'layLich', { thang: th }]);
  if (qbc('NghiemThu') || qbc('Loi')) viec.push(['bc2_' + th, 'baoCao', { thang: th }]);
  for (const v of viec) {
    if (!APP || OFFLINE) return;
    if (CUR && ((v[1] === 'layLich' && CUR.fn === 'lich') || (v[1] === 'baoCao' && CUR.fn === 'baoCao'))) continue;
    const r = await call(v[1], v[2], true, true);
    if (r) cSet(v[0], r);
  }
}
/* ---------------- tự làm mới: hỏi máy chủ 20 giây/lần, dữ liệu đổi thì vẽ lại màn hình ---------------- */
let VER = null, CHO_LM = false, CAT_LUC = 0, NT_DANG = false;
const TRANG_LM = ['home', 'ddPage', 'quetTram', 'phunPage', 'yc', 'ycCT', 'khu', 'khuCT', 'lich'];
async function nhipTim() {
  if (!APP || !TOKEN || OFFLINE || NT_DANG || document.hidden) return;
  NT_DANG = true;
  try {
    const r = await call('nhipTim', {}, true, true);
    if (r && r.ver) { if (VER && r.ver !== VER) CHO_LM = true; VER = r.ver; }
    if (CHO_LM) await tuLamMoi();
  } finally { NT_DANG = false; }
}
function dangGo() {
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  if ($('.sheet-bg')) return true;
  if (CUR && CUR.fn === 'ycCT' && $('#ycf') && $('#ycf').value) return true;
  if (CUR && CUR.fn === 'lich' && (LICH_SUA || LICH_DOI)) return true;
  return BUSY > 0 || DANG_GUI;
}
async function tuLamMoi() {
  if (!CUR || dangGo()) return;
  CHO_LM = false;
  if (Date.now() - CAT_LUC > 60000) { CAT_LUC = Date.now(); await taiLaiDanhMuc(); renderNav(); if (dangGo()) return; }
  if (!TRANG_LM.includes(CUR.fn)) return;
  const y = window.scrollY, me = CUR;
  await PAGES[CUR.fn](...CUR.args);
  if (me === CUR) setTimeout(() => window.scrollTo(0, y), 60);
}
setInterval(nhipTim, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) nhipTim(); });
function lamMoiTrang() {
  if (!CUR) return;
  if (['home', 'hangDoi', 'yc', 'khuCT', 'baoCao', 'more'].includes(CUR.fn)) PAGES[CUR.fn](...CUR.args);
}

/* ---------------- đăng nhập ---------------- */
function renderLogin() {
  APP = null;
  $('#nav').innerHTML = ''; $('#who').style.display = 'none'; setTitle('Giám sát kiểm soát côn trùng'); $('#back').style.visibility = 'hidden'; $('#gpsPill').style.display = 'none'; $('#hdPill').style.display = 'none';
  const tenCu = LS.get('kct_user') || '';
  main(`<form class="login" onsubmit="dangNhap();return false" autocomplete="on"><div class="logo">🐀🦟🐍</div><h2>Đăng nhập</h2><p class="muted" style="text-align:center">Giám sát dịch vụ kiểm soát chuột – côn trùng – rắn<br>Sun World Fansipan Legend</p>
    <div class="fld"><label>Tên đăng nhập</label><input id="lu" name="username" autocomplete="username" autocapitalize="off" value="${h(tenCu)}"></div>
    <div class="fld"><label>Mật khẩu</label><input id="lp" name="password" type="password" autocomplete="current-password"></div>
    <div class="fld"><label class="row" style="font-weight:400"><input type="checkbox" id="lnho" checked> Ghi nhớ đăng nhập trên máy này</label></div>
    <button class="btn btn-block big" type="submit">Đăng nhập</button><div class="muted" style="text-align:center;margin-top:10px">Phiên bản ${PHIEN_BAN}</div></form>`);
  if (tenCu) setTimeout(() => $('#lp') && $('#lp').focus(), 50);
}
async function dangNhap() {
  const nho = $('#lnho').checked;
  const r = await call('dangNhap', { u: $('#lu').value, p: $('#lp').value, nho });
  if (!r) return;
  TOKEN = r.token;
  LS.set('kct_user', $('#lu').value.trim());
  if (nho) LS.set('kct_token', TOKEN); else LS.del('kct_token');
  LS.del('kct_app');
  start();
}
function apDungApp(r) {
  const coMatCu = APP && APP.homNay === r.homNay ? APP.coMatHom : '';
  APP = r;
  if (!APP.coMatHom && coMatCu) APP.coMatHom = coMatCu;
  if (r.token) { TOKEN = r.token; if (LS.get('kct_token')) LS.set('kct_token', TOKEN); }
  LECH_GIO = r.gioMay - Date.now();
  LS.set('kct_lech', String(LECH_GIO));
  try { const c = Object.assign({}, r); delete c.token; c.luuLuc = Date.now(); LS.set('kct_app', JSON.stringify(c)); } catch (e) {}
}
function moDau() {
  veMang(); capNhatHD(); batGPS();
  if (QR_CHO) {
    const c = QR_CHO; QR_CHO = '';
    renderNav('home');
    STACK = [{ fn: 'home', args: [] }]; CUR = null;
    return c.includes('-') ? go('tramCT', [c, 'QR'], false) : go('khuCT', [c, 'QR'], false);
  }
  setTimeout(osTuDong, 2500);
  if (YC_CHO) {
    const c = YC_CHO; YC_CHO = '';
    renderNav(dauTab());
    STACK = [{ fn: dauTab(), args: [] }]; CUR = null;
    return go('ycCT', [c], false);
  }
  tab(dauTab());

const HD = {

/** GPS bật mặc định: theo dõi liên tục từ lúc đăng nhập */
function batGPS() {

    GPS_LOI = null; veGPS();
  }, e => {
    GPS_LOI = e.code === 1 ? 'Trình duyệt chưa được cho phép dùng vị trí' : e.code === 2 ? 'Điện thoại đang tắt định vị (GPS) hoặc không bắt được tín hiệu' : 'Chưa lấy được vị trí, đang thử lại…';

/** Vùng chứa vị trí: Ga đi / Ga đến / TTTM Sunplaza / Ngoài khu du lịch */
function vungCua(g) {
  if (!g) return '';
  const ds = (APP && APP.vung || []).filter(v => v.lat);
  if (!ds.length) return '';
  const R = 6371000, r = Math.PI / 180;
  let tot = null, kc = Infinity;
  ds.forEach(v => {
    const x = Math.sin((v.lat - g.lat) * r / 2) ** 2 + Math.cos(g.lat * r) * Math.cos(v.lat * r) * Math.sin((v.lng - g.lng) * r / 2) ** 2;
    const d = 2 * R * Math.asin(Math.sqrt(x));
    if (d <= v.r + Math.min(g.acc || 0, 100) && d < kc) { tot = v; kc = d; }
  });
  return tot ? tot.ten : 'Ngoài khu du lịch';
}

/** Nén ảnh và đóng dấu cố định: ngày giờ (giờ máy chủ), vị trí, tọa độ GPS, người chụp */
function nenAnh(file, g, lucChup) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, hh = img.naturalHeight; const sc = Math.min(1, 1152 / Math.max(w, hh));
      w = Math.round(w * sc); hh = Math.round(hh * sc);
      const c = document.createElement('canvas'); c.width = w; c.height = hh; const x = c.getContext('2d');
      x.drawImage(img, 0, 0, w, hh);
      const d = bayGio(), p2 = n => String(n).padStart(2, '0');
      const thu = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'][d.getDay()];
      const dong = [
        { t: `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}  ${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${d.getFullYear()}`, to: 1.55, dam: 1 },
        { t: thu + (WM ? '  ·  ' + WM : ''), to: 1 },
        (() => { const v = vungCua(g); return { t: !g ? '📍 KHÔNG CÓ VỊ TRÍ GPS' : '📍 ' + (v === 'Ngoài khu du lịch' ? 'NGOÀI KHU DU LỊCH' : v ? v + ' – Sun World Fansipan Legend' : 'Đã định vị (vùng chưa thiết lập)'), to: 1.15, dam: 1, mau: !g || v === 'Ngoài khu du lịch' ? '#ffb3a8' : '#ffe27a' }; })(),
        { t: 'Người chụp: ' + APP.user.hoTen + (g ? `  ·  ${g.lat.toFixed(5)}, ${g.lng.toFixed(5)} ±${g.acc}m` : ''), to: .8 }
      ];
      if (lucChup) { const c = new Date(lucChup); dong.splice(1, 0, { t: `⚠ ẢNH CHỤP LÚC ${p2(c.getHours())}:${p2(c.getMinutes())} ${p2(c.getDate())}/${p2(c.getMonth() + 1)} – TẢI LÊN SAU`, to: 1, dam: 1, mau: '#ffb3a8' }); }
      const fs = Math.max(15, Math.round(Math.min(w, hh) / 26));
      const pad = Math.round(fs * .7);
      let cao = pad;
      dong.forEach(l => cao += fs * l.to * 1.32);
      cao += pad * .5;
      x.fillStyle = 'rgba(0,0,0,.58)'; x.fillRect(0, hh - cao, w, cao);
      x.fillStyle = '#f5b800'; x.fillRect(0, hh - cao, Math.max(4, Math.round(fs / 4)), cao);
      let y = hh - cao + pad;
      x.textBaseline = 'top'; x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = 3;
      dong.forEach(l => {
        x.font = `${l.dam ? '700 ' : ''}${Math.round(fs * l.to)}px Roboto, "Helvetica Neue", Arial, sans-serif`;
        x.fillStyle = l.mau || '#fff';
        x.fillText(l.t, pad + 4, y, w - pad * 2);
        y += fs * l.to * 1.32;
      });
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .64));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Không đọc được ảnh')); };
    img.src = url;
  });
}

  return `<div class="alert">⚠ Đang mất mạng – vẫn quét QR, chụp ảnh, ghi kiểm tra / phun bình thường; dữ liệu lưu trong máy và tự gửi khi có sóng.${luc ? '<br><small>Danh mục cập nhật lúc ' + h(luc) + '</small>' : ''}</div>`;
}
function khuOffline(ma, cach) {
  const k = APP.khu.find(x => x.ma === ma);
  if (!k) return main(bannerOffline() + '<div class="card">Không tìm thấy khu ' + h(ma) + '.</div>');
  const ds = APP.tram.filter(t => t.khu === ma);
  main(bannerOffline() + (cach === 'QR' ? `<div class="alert ok">✓ Đã quét QR khu vực ${h(ma)}</div>` : '')
    + `<div class="card"><b>${h(k.ma)} – ${h(k.ten)}</b><div class="muted">${h(k.nhom)}</div></div>`
    + (q('ThucHien') ? `<div class="row wrap" style="margin-bottom:10px"><button class="btn grow" onclick="go('ktKhu',['${ma}','${cach === 'QR' ? 'QR' : 'Tay'}'])">Kiểm tra khu</button><button class="btn btn-o grow" onclick="go('phun',['${ma}'])">Ghi nhận phun</button></div>` : '')
    + `<h3>Trạm bả / bẫy (${ds.filter(t => t.tt === 'Đang dùng').length})</h3>`
    + (ds.length ? ds.map(t => `<div class="item" onclick="go('tramCT',['${t.ma}'])"><div class="grow"><b>${h(t.ma)}</b> · ${h(t.loai)}${t.tt !== 'Đang dùng' ? ` <span class="tag t-warn">${h(t.tt)}</span>` : ''}<div class="muted">${h(t.viTri)}</div></div><span class="chev">›</span></div>`).join('') : '<div class="card muted">Khu chưa có trạm.</div>')
    + '<div class="muted">Lịch sử kiểm tra sẽ hiện lại khi có mạng.</div>');
}
function tramOffline(ma, cach) {
  const t = APP.tram.find(x => x.ma === ma);
  if (!t) return main(bannerOffline() + '<div class="card">Trạm ' + h(ma) + ' chưa có trong danh mục lưu trên máy. Khi có mạng mở lại app để cập nhật danh mục.</div>');
  let s = bannerOffline() + `<div class="card"><div class="row sb"><b>${h(t.ma)} · ${h(t.loai)}</b>${t.tt !== 'Đang dùng' ? `<span class="badge t-warn">${h(t.tt)}</span>` : ''}</div><div>${h(t.viTri)}</div><div class="muted">${h(t.khu)} – ${h(tenKhu(t.khu))}</div></div>`;
  if (q('ThucHien') && t.tt === 'Đang dùng') {
    s += cach === 'QR' ? `<div class="alert ok">✓ Đã quét QR trạm – ghi nhận kết quả bên dưới</div><div id="fkt"></div>`
      : `<div id="fkt"><button class="btn btn-o btn-block" onclick="moFormTram('${t.ma}','Tay')">Ghi kiểm tra không quét QR (tem hỏng/mất)</button></div>`;
  }
  main(s);
  if (q('ThucHien') && t.tt === 'Đang dùng' && cach === 'QR') moFormTram(t.ma, 'QR');
}

const NHOM_KHU = ['Ga đi', 'Ga đến Fansipan', 'Ga Sa Pa (TTTM)'];
PAGES.khu = function () {
  setTitle('Khu vực');
  const sua = q('KhaiTram');
  main(`<div class="row" style="margin-bottom:10px"><input id="tk" placeholder="Tìm khu vực, vị trí…" oninput="veDsKhu()" class="grow">${moCv() ? `<button class="btn" onclick="batDau('scan')">📷</button>` : ''}</div>
    ${sua ? `<div class="mrow"><button class="btn" onclick="go('khuForm',[''])">＋ Thêm khu vực</button><button class="btn btn-o" onclick="go('tram')">🏷 Trạm & in tem QR</button></div>` : `<button class="btn btn-o btn-block" onclick="go('tram')">🏷 Danh sách trạm & tem QR</button>`}
    <div id="dsk"></div>`);
  veDsKhu();
};
function veDsKhu() {
  const t = ($('#tk').value || '').toLowerCase();
  const g = {};
  APP.khu.filter(k => !t || (k.ma + ' ' + k.ten).toLowerCase().includes(t) || APP.tram.some(x => x.khu === k.ma && (x.ma + ' ' + x.viTri).toLowerCase().includes(t))).forEach(k => (g[k.nhom] = g[k.nhom] || []).push(k));
  const xemTT = q('XemBaoCao') || q('QuanTri');
  $('#dsk').innerHTML = Object.keys(g).map(n => {
    const tong = APP.khu.filter(k => k.nhom === n).reduce((a, k) => a + (k.tt || 0), 0);
    return `<div class="grp row sb"><span>${h(n)} · ${g[n].length} khu</span>${xemTT ? `<span>${Math.round(tong * 100) / 100}%</span>` : ''}</div>` + g[n].map(k => {
      const st = APP.tram.filter(x => x.khu === k.ma && x.tt === 'Đang dùng').length;
      return `<div class="item" onclick="go('khuCT',['${k.ma}'])"><div class="grow"><b>${k.ma}</b> ${h(k.ten)}<div class="tags"><span class="tag">${st} trạm</span><span class="tag t-ok">KT ${k.kt}/tuần</span>${k.pt ? `<span class="tag t-bad">Phun ${k.pt}/tháng</span>` : ''}${k.pq ? `<span class="tag t-bad">Phun ${k.pq}/quý</span>` : ''}${k.sa ? `<span class="tag t-warn">Sả ${k.sa}/tháng</span>` : ''}${k.cap ? '<span class="tag">🚡 trên đỉnh</span>' : ''}${xemTT ? `<span class="tag">⚖ ${k.tt}%</span>` : ''}</div></div><span class="chev">›</span></div>`;
    }).join('');
  }).join('') || '<div class="muted">Không tìm thấy.</div>';
}

    <label class="row" style="font-weight:400;margin:4px 0 12px"><input type="checkbox" id="kfC" ${k && k.cap ? 'checked' : ''}> 🚡 Khu trên đỉnh (phải đi cáp – ban đêm tính hạn có mặt theo mốc sáng)</label>
    ${q('QuanTri') ? `<div class="fld"><label>Tỷ trọng nghiệm thu (% toàn khu du lịch)</label><input id="kfTT" type="number" inputmode="decimal" step="0.1" min="0" max="100" value="${k ? k.tt : 0}"><div class="muted">Tổng tất cả khu phải bằng 100% – chỉnh tổng thể ở Cài đặt › Tỷ trọng khu vực.</div></div>` : ''}
    <button class="btn big btn-block" onclick="luuKhuF(this,'${k ? k.ma : ''}')">💾 Lưu</button>

async function luuKhuF(b, cu) {
  const p = { cu, nhom: $('#kfN').value, ten: $('#kfT').value.trim(), kt: $('#kfKT').value, pt: $('#kfPT').value, sa: $('#kfSA').value, pq: $('#kfPQ').value, cap: $('#kfC').checked };
  if ($('#kfM')) p.ma = $('#kfM').value.trim();
  if ($('#kfTT')) p.tt = $('#kfTT').value;
  const r = await gui(b, 'luuKhu', p, 'Đã lưu khu ' + (cu || ''));
  if (!r) return;
  await taiLaiDanhMuc();
  if (!cu) toast('Đã thêm khu ' + r.ma + ' – nhớ thêm trạm và in tem QR');
  goBack();
}
async function xoaKhuF(b, ma) {
  if (!confirm('Xóa khu ' + ma + '? Khu sẽ ẩn khỏi danh sách và lịch; dữ liệu cũ vẫn giữ để báo cáo.')) return;
  const r = await gui(b, 'xoaKhu', { ma }, 'Đã xóa khu ' + ma);
  if (!r) return;
  await taiLaiDanhMuc();
  STACK = []; tab('khu');
}
async function taiLaiDanhMuc() { const r = await call('khoiTao', {}, true, true); if (r) apDungApp(r); }
PAGES.khuCT = function (ma, cach) {

function veKhuCT(r, ma, cach) {
  const k = r.khu, hn = r.homNay;
  let s = cach === 'QR' ? `<div class="alert ok">✓ Đã quét QR khu vực ${h(k.ma)}</div>` : '';
  s += `<div class="card"><b>${h(k.ma)} – ${h(k.ten)}</b><div class="row sb"><span class="muted">${h(k.nhom)}</span>${q('KhaiTram') ? `<button class="btn btn-o btn-s" onclick="go('khuForm',['${k.ma}'])">✏️ Sửa khu</button>` : ''}</div><div class="tags">
    <span class="tag">Kiểm tra ${k.kt}/tuần</span>${+k.pt ? `<span class="tag">Phun ${k.pt}/tháng</span>` : ''}${+k.pq ? `<span class="tag">Phun ${k.pq}/quý</span>` : ''}${+k.sa ? `<span class="tag">Sả ${k.sa}/tháng</span>` : ''}</div>
    <div class="muted" style="margin-top:6px">Hôm nay: ${hn.soTram ? `đã quét ${hn.soQuet}/${hn.soTram} trạm` : (hn.coHoatDong ? 'đã kiểm tra khu' : 'chưa kiểm tra')}${hn.hopLe ? ' ✓' : ''}</div></div>`;
  if (q('ThucHien')) s += `<div class="row wrap" style="margin-bottom:10px"><button class="btn grow" onclick="go('ktKhu',['${k.ma}','${cach === 'QR' ? 'QR' : 'Tay'}'])">Kiểm tra khu</button><button class="btn btn-o grow" onclick="go('phun',['${k.ma}'])">Ghi nhận phun</button></div>`;
  s += `<div class="row sb"><h3>Trạm bả / bẫy (${r.tram.filter(t => t.tt === 'Đang dùng').length})</h3>${q('KhaiTram') ? `<button class="btn btn-o btn-s" onclick="go('tramForm',[null,'${k.ma}'])">＋ Thêm trạm</button>` : ''}</div>`;
  s += r.tram.length ? r.tram.map(t => `<div class="item" onclick="go('tramCT',['${t.ma}'])"><div class="grow"><b>${h(t.ma)}</b> · ${h(t.loai)}${t.nong ? ' <span class="tag t-bad">🔥 điểm nóng</span>' : ''}${t.tt !== 'Đang dùng' ? ` <span class="tag t-warn">${h(t.tt)}</span>` : ''}<div class="muted">${h(t.viTri)}</div>
    <div class="muted">${t.cuoi ? 'Lần cuối ' + hm(t.cuoi.tg) + ' · bả: ' + h(t.cuoi.ba) + (t.cuoi.dh && t.cuoi.dh !== 'Không có' ? ' · ' + h(t.cuoi.dh) : '') : 'Chưa kiểm tra lần nào'}</div></div><span class="chev">›</span></div>`).join('')
    : `<div class="card muted">Khu chưa khai báo trạm. Khi chưa có trạm, lượt kiểm tra được tính bằng phiếu "Kiểm tra khu".</div>`;
  s += `<h3>Hoạt động 30 ngày gần nhất</h3>` + (r.hoatDong.length ? r.hoatDong.map(a => `<div class="card"><div class="row sb"><b>${h(a.loai)}</b><span class="muted">${hm(a.tg)}</span></div><div class="muted">${h(a.ai)}${a.cach === 'Tay' ? ' · <span style="color:var(--or)">không quét QR</span>' : ''}</div>${a.nd ? `<div ${a.canhBao ? 'style="color:var(--red)"' : ''}>${h(a.nd)}</div>` : ''}${thumbs(a.anh)}</div>`).join('') : '<div class="card muted">Chưa có.</div>');
  main(s);
};

PAGES.tramCT = async function (ma, cach) {
  setTitle(ma); main('<div class="muted">Đang tải…</div>');
  const me = CUR; const r = OFFLINE ? null : await call('chiTietTram', { ma }, true, true); if (me !== CUR) return;
  if (!r) { if (OFFLINE || LOI_MANG) return tramOffline(ma, cach); return toast(LOI_CUOI, 'err'); }
  const t = r.tram;
  let s = `<div class="card"><div class="row sb"><b>${h(t.ma)} · ${h(t.loai)}</b>${t.tt !== 'Đang dùng' ? `<span class="badge t-warn">${h(t.tt)}</span>` : ''}</div>
    <div>${h(t.viTri)}</div><div class="muted">${h(t.khu)} – ${h(t.tenKhu)}</div>${thumbs(t.anh)}
    ${q('KhaiTram') ? `<div style="margin-top:8px"><button class="btn btn-o btn-s" onclick="go('tramForm',['${t.ma}'])">Sửa trạm</button></div>` : ''}</div>`;
  if (q('ThucHien') && t.tt === 'Đang dùng') {
    if (cach === 'QR') s += `<div class="alert ok">✓ Đã quét QR trạm – ghi nhận kết quả kiểm tra bên dưới</div><div id="fkt"></div>`;
    else s += `<div id="fkt"><button class="btn btn-o btn-block" onclick="moFormTram('${t.ma}','Tay')">Ghi kiểm tra không quét QR (tem hỏng/mất)</button><div class="muted" style="margin:-4px 0 10px">Lượt nhập tay sẽ bị đánh dấu trong báo cáo.</div></div>`;
  }
  s += `<h3>Lịch sử kiểm tra</h3>` + (r.lichSu.length ? r.lichSu.map(l => `<div class="card"><div class="row sb"><b>Bả: ${h(l.ba)}${l.thay ? ' · đã thay bả' : ''}</b><span class="muted">${hm(l.tg)}</span></div>
    <div class="muted">${h(l.ai)} · Trạm: ${h(l.tram)}${l.cach === 'Tay' ? ' · <span style="color:var(--or)">nhập tay</span>' : ''}</div>
    ${l.dh && l.dh !== 'Không có' ? `<div>Dấu hiệu: ${h(l.dh)}</div>` : ''}${l.gc ? `<div>${h(l.gc)}</div>` : ''}${thumbs(l.anh)}</div>`).join('') : '<div class="card muted">Chưa có.</div>');
  if (t.lichSu) s += `<details><summary>Lịch sử thay đổi trạm</summary><div class="in timeline">${h(t.lichSu)}</div></details>`;
  main(s);
  if (q('ThucHien') && t.tt === 'Đang dùng' && cach === 'QR') moFormTram(t.ma, 'QR');
};

PAGES.phun = function (ma) {
  if (chanDiemDanh({ fn: 'phun', args: [ma] })) return;
  setTitle('Phun ' + ma); WM = 'Phun ' + ma + ' · ' + tenKhu(ma);
  const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
  const pm = s => { const a = String(s || '0:0').split(':'); return +a[0] * 60 + (+a[1] || 0); };
  const tu = pm(APP.cfg.PhunTu), den = pm(APP.cfg.PhunDen);
  const ok = tu > den ? (m >= tu || m < den) : (m >= tu && m < den);
  main(`<div class="card"><b>${h(ma)} – ${h(tenKhu(ma))}</b></div>
    ${ok ? '' : `<div class="alert err">Hiện đang ngoài khung giờ được phun (${h(APP.cfg.PhunTu)} – ${h(APP.cfg.PhunDen)}, HĐ Điều 1.4). Lần phun này sẽ bị đánh dấu.</div>`}
    <div class="card"><div class="fld"><label>Loại phun *</label>${chips('lp', APP.dm.loaiPhun, false, 'Định kỳ')}</div>
    <div class="fld"><label>Hóa chất sử dụng (danh mục PL01) *</label>${chips('hc', APP.hoaChat.map(x => x.ten), true)}</div>

    ${photoField('nhan', 'Ảnh nhãn hóa chất (thấy số lô, hạn dùng)', true)}
    ${photoField('pa', 'Ảnh đang phun tại khu', true)}
    <div class="fld"><label>Ghi chú</label><textarea id="gc"></textarea></div>${gpsBox()}

async function guiPhun(b, ma) {

/* ---- Tỷ trọng khu vực ---- */
function soTuanThang(th) {
  const y = +th.slice(0, 4), m = +th.slice(5, 7);
  const dau = new Date(Date.UTC(y, m - 1, 1)), cuoi = new Date(Date.UTC(y, m, 0));
  let d = new Date(dau.getTime() - ((dau.getUTCDay() + 6) % 7) * 864e5), n = 0;
  while (d <= cuoi) { if (new Date(d.getTime() + 3 * 864e5).getUTCMonth() === m - 1) n++; d = new Date(d.getTime() + 7 * 864e5); }
  return n;
}

  NHOM_KHU.concat(APP.khu.map(x => x.nhom)).filter((v, i, a) => a.indexOf(v) === i).forEach(n => {

  });
  if (sua) s += `<div class="savebar" style="bottom:64px"><span id="ttMsg">Tổng phải bằng 100%</span><button class="btn btn-s" onclick="luuTT(this)">💾 Lưu tỷ trọng</button></div><div style="height:60px"></div>`;

function chiaDeu(b) {
  const inp = b.previousElementSibling, n = inp.dataset.n, v = +inp.value;
  if (!(v > 0)) return toast('Nhập tổng % của nhóm', 'err');
  const os = [...document.querySelectorAll('.ttO')].filter(x => x.dataset.n === n);
  const moi = Math.floor(v / os.length * 100) / 100; let du = Math.round((v - moi * os.length) * 100) / 100;
  os.forEach((x, i) => { x.value = i === 0 ? Math.round((moi + du) * 100) / 100 : moi; });
  veTong();
}
function veTong() {
  const phi = APP.cfg.GiaTriHopDong || 0, kt = (+$('#tyKT').value || 0) / 100, nt = soTuanThang(homStr().slice(0, 7));
  let tong = 0; const nhom = {};
  document.querySelectorAll('.ttO').forEach(x => {
    const v = +x.value || 0; tong += v; nhom[x.dataset.n] = (nhom[x.dataset.n] || 0) + v;
    const k = APP.khu.find(z => z.ma === x.dataset.ma); const e = document.querySelector(`.vd[data-ma="${x.dataset.ma}"]`);
    if (k && e) {
      const tienK = phi * v / 100, canKT = k.kt * nt, canP = k.pt + k.sa + (k.pq ? k.pq / 3 : 0);
      const pKT = canKT ? (canP ? kt : 1) : 0, pP = canP ? (canKT ? 1 - kt : 1) : 0;
      e.textContent = `${tien(Math.round(tienK))}/tháng` + (canKT ? ` · thiếu 1 lần KT ≈ ${tien(Math.round(tienK * pKT / canKT))}` : '') + (canP ? ` · thiếu 1 lần phun ≈ ${tien(Math.round(tienK * pP / Math.max(1, Math.round(canP))))}` : '');
    }
  });
  tong = Math.round(tong * 100) / 100;
  const ok = Math.abs(tong - 100) < 0.05;
  $('#ttTong').textContent = tong + '%'; $('#ttTong').style.color = ok ? 'var(--g)' : 'var(--red)';
  $('#ttNhom').innerHTML = Object.keys(nhom).map(n => `<span class="tag">${h(n)}: ${Math.round(nhom[n] * 100) / 100}%</span>`).join('');
  if ($('#ttMsg')) $('#ttMsg').textContent = ok ? '✓ Tổng 100%' : 'Tổng đang ' + tong + '% (phải 100%)';
}

/** Vẽ 1 tem lên canvas 300 dpi */
function veTemCanvas(t, co) {
  const mm = 300 / 25.4, W = Math.round(co[0] * mm), H = Math.round(co[1] * mm), pad = Math.round(2 * mm);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  const q = H - pad * 2;
  const tmp = document.createElement('div');
  new QRCode(tmp, { text: urlTem() + '?t=' + encodeURIComponent(t.code), width: q, height: q, correctLevel: QRCode.CorrectLevel.M });
  const qc = tmp.querySelector('canvas');
  g.imageSmoothingEnabled = false;
  if (qc) g.drawImage(qc, pad, pad, q, q);
  const x = pad * 2 + q, rong = W - x - pad;
  const dong = (txt, px, dam, mau, y) => {
    g.font = `${dam ? '700 ' : ''}${px}px Arial, "Helvetica Neue", sans-serif`; g.fillStyle = mau || '#111';
    let s = String(txt || '');
    while (s.length > 1 && g.measureText(s).width > rong) s = s.slice(0, -2) + '…';
    g.fillText(s, x, y); return y;
  };
  g.textBaseline = 'top';
  const fs = Math.round(H / 7.2);
  let y = pad;
  dong(t.code, Math.round(fs * 1.35), 1, '#000', y); y += fs * 1.65;
  dong(t.l1, fs, 0, '#222', y); y += fs * 1.3;
  // tên khu có thể dài: tách 2 dòng
  g.font = `${Math.round(fs * .85)}px Arial, sans-serif`;
  const tu = String(t.l2 || '').split(' '); let d1 = '', i = 0;
  while (i < tu.length && g.measureText((d1 + ' ' + tu[i]).trim()).width <= rong) { d1 = (d1 + ' ' + tu[i]).trim(); i++; }
  dong(d1, Math.round(fs * .85), 0, '#444', y); y += fs * 1.05;
  if (i < tu.length) { dong(tu.slice(i).join(' '), Math.round(fs * .85), 0, '#444', y); y += fs * 1.05; }
  dong('Quét QR để ghi nhận kiểm tra', Math.round(fs * .62), 0, '#666', H - pad - fs * .7);
  return c;
}
async function taoFileTem(b) {
  const ds = dsTemXuat(); if (!ds.length) return toast('Chưa có tem nào', 'err');
  const co = CO_TEM[XT.co];
  b.disabled = true; b.textContent = 'Đang tạo…';
  try {
    let blob, ten;
    const ngay = homStr().replace(/-/g, '');
    if (XT.dd === 'pdf') {
      await napScript('PDF', ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'], () => !!(window.jspdf && window.jspdf.jsPDF));
      const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
      const le = 8, gap = 3, cot = Math.max(1, Math.floor((210 - le * 2 + gap) / (co[0] + gap))), hang = Math.max(1, Math.floor((297 - le * 2 + gap) / (co[1] + gap)));
      ds.forEach((t, i) => {
        const o = i % (cot * hang); if (i && !o) pdf.addPage();
        const x = le + (o % cot) * (co[0] + gap), y = le + Math.floor(o / cot) * (co[1] + gap);
        pdf.addImage(veTemCanvas(t, co).toDataURL('image/png'), 'PNG', x, y, co[0], co[1], undefined, 'FAST');
        pdf.setDrawColor(170); pdf.setLineDashPattern([1, 1], 0); pdf.setLineWidth(0.15); pdf.rect(x, y, co[0], co[1]);
      });
      blob = pdf.output('blob'); ten = `Tem_QR_${XT.nd === 'khu' ? 'khu' : 'tram'}_${ngay}.pdf`;
    } else {
      await napScript('ZIP', ['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'], () => !!window.JSZip);
      const zip = new JSZip();
      for (const t of ds) {
        const c = veTemCanvas(t, co);
        const pb = await new Promise(r => c.toBlob(r, 'image/png'));
        zip.file(t.code.replace(/[^\w.-]/g, '_') + '.png', pb);
      }

    }
    xongFile(blob, ten);
  } catch (e) { toast(e.message || String(e), 'err'); b.disabled = false; b.textContent = 'Tạo file'; }
}

/** Gom nhật ký (kiểm tra trạm / khu / phun / điểm danh) thành một danh sách thẻ, mới nhất trước */
function nkDs(r) {

  r.khu.forEach(x => ds.push({ loai: 'Kiểm tra khu', tg: x[0], khu: x[1], dt: x[1], ai: x[2], nd: [x[4] && 'Côn trùng: ' + x[4], x[5] && 'Rắn: ' + x[5], +x[6] ? 'Xác chuột: ' + x[6] : '', x[7], x[8]].filter(Boolean).join(' · '), vung: x[11], anh: x[10], cach: x[12], tay: x[3] !== 'QR' }));

const NAP = {};
/** Tải thư viện ngoài khi cần (thử lần lượt các nguồn) */
function napScript(ten, nguon, coSan) {
  if (coSan()) return Promise.resolve();
  if (NAP[ten]) return NAP[ten];
  const thu = i => new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = nguon[i];
    sc.onload = res; sc.onerror = () => (i + 1 < nguon.length ? thu(i + 1).then(res, rej) : rej(new Error('Không tải được thư viện ' + ten + ' – kiểm tra kết nối mạng')));
    document.head.appendChild(sc);
  });
  NAP[ten] = thu(0).catch(e => { NAP[ten] = null; throw e; });
  return NAP[ten];
}
function napExcel() {
  return napScript('Excel', ['https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js', 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js'], () => !!window.ExcelJS);
}
function napJsQR() {
  return napScript('quét QR', ['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js', 'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js'], () => !!window.jsQR);
}
async function taiXuong(wb, ten) {
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = ten; document.body.appendChild(a); a.click(); a.remove();
  toast('Đã tạo file ' + ten);
  setTimeout(() => URL.revokeObjectURL(url), 120000);
}
const XL = {
  xanh: 'FF1F7A4D', xanhNhat: 'FFE3EFE3', xam: 'FFF2F2F2', do: 'FFFDECEA', cam: 'FFFFF4E0',
  vien: { top: { style: 'thin', color: { argb: 'FFBFC9C3' } }, left: { style: 'thin', color: { argb: 'FFBFC9C3' } }, bottom: { style: 'thin', color: { argb: 'FFBFC9C3' } }, right: { style: 'thin', color: { argb: 'FFBFC9C3' } } }
};
function nen(c, argb) { c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb } }; }
/** Thêm một trang dạng bảng: cols = [{h, w}], rows = mảng dòng */
function trangBang(wb, ten, tieuDe, cols, rows, tuyChon) {
  tuyChon = tuyChon || {};
  const ws = wb.addWorksheet(ten, { views: [{ state: 'frozen', ySplit: tieuDe ? 3 : 1 }] });
  let r = 1;
  if (tieuDe) {
    ws.getCell(1, 1).value = tieuDe; ws.getCell(1, 1).font = { bold: true, size: 13, color: { argb: XL.xanh } };
    ws.getCell(2, 1).value = 'HĐ ' + ((BC && BC.nt && BC.nt.soHD) || APP.cfg.SoHopDong || '') + ' – ' + ((BC && BC.nt && BC.nt.ncc) || APP.cfg.NhaCungCap || ''); ws.getCell(2, 1).font = { italic: true, color: { argb: 'FF6B7A71' } };
    r = 3;
  }
  const hr = ws.getRow(r);
  cols.forEach((c, i) => { const x = hr.getCell(i + 1); x.value = c.h; x.font = { bold: true, color: { argb: 'FFFFFFFF' } }; nen(x, XL.xanh); x.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true }; x.border = XL.vien; ws.getColumn(i + 1).width = c.w || 14; });
  hr.height = 30;
  rows.forEach(row => {
    r++;
    const wr = ws.getRow(r);
    if (row && row._nhom) { const x = wr.getCell(1); x.value = row._nhom; x.font = { bold: true }; for (let i = 1; i <= cols.length; i++) { nen(wr.getCell(i), XL.xanhNhat); wr.getCell(i).border = XL.vien; } return; }
    row.forEach((v, i) => {
      const x = wr.getCell(i + 1);
      if (v && typeof v === 'object' && v.link) { x.value = { text: v.text, hyperlink: v.link }; x.font = { color: { argb: 'FF1155CC' }, underline: true }; }
      else x.value = v === '' || v === null || v === undefined ? null : v;
      x.border = XL.vien; x.alignment = { vertical: 'top', wrapText: true, horizontal: cols[i].c ? 'center' : 'left' };
      if (cols[i].so) x.numFmt = cols[i].so;
    });
    if (tuyChon.to) { const m = tuyChon.to(row); if (m) for (let i = 1; i <= cols.length; i++) nen(wr.getCell(i), m); }
  });
  ws.autoFilter = { from: { row: tieuDe ? 3 : 1, column: 1 }, to: { row: tieuDe ? 3 : 1, column: cols.length } };
  return ws;
}

function chuThuong(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'd').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
function giaTri(cell) {

let SCAN = null;
PAGES.scan = async function () {
  if (chanDiemDanh({ fn: 'scan', args: [] })) return;
  setTitle('Quét mã QR');
  main('<div class="card" style="padding:0;overflow:hidden;position:relative;background:#000">'
    + '<video id="sv" playsinline muted autoplay style="width:100%;display:block;max-height:58vh;object-fit:cover"></video>'
    + '<div style="position:absolute;left:18%;right:18%;top:18%;bottom:18%;border:3px solid rgba(255,255,255,.85);border-radius:12px"></div></div>'
    + '<div id="sm" class="muted" style="margin-bottom:10px">Đang mở camera… đưa tem QR vào giữa khung.</div>'
    + '<label class="btn btn-o btn-block"><input type="file" accept="image/*" capture="environment" hidden onchange="quetAnh(this)">📷 Chụp ảnh tem (nếu camera không mở)</label>'
    + '<div class="fld"><label>Hoặc nhập mã (tem hỏng)</label><div class="row"><input id="sma" placeholder="VD: C15-001 hoặc C15" autocapitalize="characters"><button class="btn" onclick="moMa($(\'#sma\').value,\'Tay\')">Mở</button></div></div>');
  const me = CUR;
  try { await napJsQR(); } catch (e) { if ($('#sm')) $('#sm').textContent = e.message; return; }
  if (me !== CUR) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('#sm').textContent = 'Trình duyệt không mở được camera trực tiếp – dùng nút chụp ảnh tem.'; return; }
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    const v = $('#sv');
    if (me !== CUR || !v) { st.getTracks().forEach(t => t.stop()); return; }
    SCAN = { st, t: null };
    v.srcObject = st;
    try { await v.play(); } catch (e) {}
    $('#sm').textContent = 'Đưa tem QR vào giữa khung…';
    const c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently: true });
    const vong = () => {
      if (!SCAN || !document.body.contains(v)) return dungQuet();
      if (v.readyState >= 2 && v.videoWidth) {
        const sc = Math.min(1, 720 / Math.max(v.videoWidth, v.videoHeight));
        c.width = Math.round(v.videoWidth * sc); c.height = Math.round(v.videoHeight * sc);
        x.drawImage(v, 0, 0, c.width, c.height);
        const kq = jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'dontInvert' });
        if (kq && kq.data) { if (navigator.vibrate) navigator.vibrate(80); return moMa(kq.data, 'QR'); }
      }
      SCAN.t = setTimeout(vong, 160);
    };
    vong();
  } catch (e) {
    if ($('#sm')) $('#sm').innerHTML = '<span style="color:var(--red)">Không mở được camera (' + h(e.message) + ').</span> Cho phép Camera cho trang này, hoặc dùng nút chụp ảnh tem bên dưới.';
  }
};
function dungQuet() {
  if (!SCAN) return;
  clearTimeout(SCAN.t);
  try { SCAN.st.getTracks().forEach(t => t.stop()); } catch (e) {}
  SCAN = null;
}
function maTuQR(raw) {
  const s = String(raw || '').trim();
  const m = s.match(/[?&]t=([A-Za-z0-9_-]+)/);
  return (m ? m[1] : s).toUpperCase().replace(/[^A-Z0-9-]/g, '');
}
function moMa(raw, cach) {
  const c = maTuQR(raw);
  if (!c) return toast('Không đọc được mã', 'err');
  const laTram = c.includes('-');
  if (laTram ? !APP.tram.some(t => t.ma === c) : !APP.khu.some(k => k.ma === c)) { toast('Không tìm thấy ' + (laTram ? 'trạm ' : 'khu ') + c + ' trong danh mục', 'err'); return; }
  dungQuet();
  if (CUR && CUR.fn === 'scan') CUR = STACK.pop() || null;
  go(laTram ? 'tramCT' : 'khuCT', [c, cach || 'QR']);
}
async function quetAnh(inp) {
  const f = inp.files[0]; inp.value = '';
  if (!f) return;
  busy(true);
  try {
    await napJsQR();
    const url = URL.createObjectURL(f);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Không đọc được ảnh')); i.src = url; });
    let kq = null;
    for (const max of [1000, 1600, 700]) {
      const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
      kq = jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
      if (kq) break;
    }
    URL.revokeObjectURL(url);
    busy(false);
    if (!kq) return toast('Không thấy mã QR trong ảnh – chụp gần và rõ hơn', 'err');
    moMa(kq.data, 'QR');
  } catch (e) { busy(false); toast(e.message, 'err'); }
}

function gioStr(m) { const ng = Math.floor(m / 1440); m = Math.round(m % 1440); return p2(Math.floor(m / 60)) + ':' + p2(m % 60) + (ng ? ' hôm sau' : ''); }
/** Tính thử hạn có mặt – cùng quy tắc với máy chủ */
function tinhHanThu(gio, loai, cap, c) {
  const m = phutStr(gio), bd = phutStr(c.SLA_NgayBatDau || '08:00'), kt = phutStr(c.SLA_NgayKetThuc || '18:30');
  if (m >= bd && m < kt) {
    if (loai === 'Rắn' && m >= phutStr(c.GioHanhChinhBatDau || '08:00') && m < phutStr(c.GioHanhChinhKetThuc || '17:00')) return m + (+c.SLA_RanGio || 1) * 60;

  if (cap) { let dl = phutStr(c.SLA_DemCapMoc || '07:15'); if (m >= kt) dl += 1440; if (dl <= m) dl = m + (+c.SLA_NgayGio || 2) * 60; return dl; }

function napOS() {
  if (OS_SAN) return OS_SAN;
  OS_SAN = new Promise((ok, loi) => {
    const het = setTimeout(() => { OS_SAN = null; loi(new Error('Không kết nối được máy chủ thông báo (mạng chặn hoặc chậm) – thử lại bằng 4G')); }, 20000);
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    const goc = location.pathname.replace(/[^/]*$/, '');
    window.OneSignalDeferred.push(async OS => {
      try {
        await OS.init({ appId: APP.cfg.OS_AppId, serviceWorkerPath: goc.slice(1) + 'sw.js', serviceWorkerParam: { scope: goc }, allowLocalhostAsSecureOrigin: true });
        clearTimeout(het); OS_OBJ = OS; ok(OS);
      } catch (e) { clearTimeout(het); OS_SAN = null; loi(e); }
    });
    if (!document.getElementById('osSdk')) {
      const sc = document.createElement('script'); sc.id = 'osSdk'; sc.defer = true;
      sc.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
      sc.onerror = () => { clearTimeout(het); OS_SAN = null; sc.remove(); loi(new Error('Không tải được bộ thông báo OneSignal (mạng chặn?)')); };
      document.head.appendChild(sc);
    }
  });
  return OS_SAN;
}
