<script>
// Bắt mọi lỗi giao diện và hiện ra màn hình (để không bị trang trắng)
window.onerror = function (m, src, dong, cot) {
  var d = document.getElementById('main');
  var t = 'Lỗi giao diện: ' + m + (dong ? ' (dòng ' + dong + ':' + cot + ')' : '');
  if (d) d.innerHTML = '<div style="background:#fdecea;color:#c0392b;padding:12px;border-radius:8px;margin:12px 0">' + t + '<br><small>Chụp màn hình này gửi người phụ trách app.</small></div>';
  else window.__loi = t;
};
window.addEventListener('unhandledrejection', function (e) { window.onerror((e.reason && e.reason.message) || String(e.reason)); });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--g:#1f7a4d;--g2:#e7f3ec;--bd:#d9e2dc;--tx:#1d2a23;--mu:#6b7a71;--red:#c0392b;--red2:#fdecea;--or:#c77700;--or2:#fff4e0;--bg:#f4f7f5;--h:40px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
#app{max-width:980px;margin:0 auto;min-height:100vh;padding-bottom:70px}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;height:52px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{background:none;border:0;color:#fff;font-size:28px;width:32px;height:40px;cursor:pointer;visibility:hidden}
#who{font-size:12px;opacity:.85;white-space:nowrap}
#gpsPill{display:none;border:0;border-radius:14px;height:28px;padding:0 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
#hdPill{display:none;border:0;border-radius:14px;height:28px;padding:0 10px;font-size:12px;font-weight:600;cursor:pointer;background:#fff4e0;color:#8a5a00;white-space:nowrap}
#gpsPill.on{background:#d6f5e3;color:#14643c}#gpsPill.wait{background:#fff4e0;color:#8a5a00}#gpsPill.off{background:#fdecea;color:#c0392b}
main{padding:12px 16px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:center}
nav button{flex:1;max-width:160px;background:none;border:0;padding:6px 0 8px;font-size:11px;color:var(--mu);cursor:pointer}
nav button span{display:block;font-size:20px;line-height:24px}
nav button.on{color:var(--g);font-weight:600}
h3{font-size:15px;margin:18px 0 8px}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.muted{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.sb{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{height:var(--h);padding:0 14px;border-radius:8px;border:1px solid var(--g);background:var(--g);color:#fff;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn-o{background:#fff;color:var(--g)}
.btn-r{background:var(--red);border-color:var(--red)}
.btn-ro{background:#fff;color:var(--red);border-color:var(--red)}
.btn-s{height:32px;padding:0 10px;font-size:13px}
.btn-block{width:100%;margin-bottom:10px}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;height:var(--h);border:1px solid var(--bd);border-radius:8px;padding:0 10px;font-size:15px;background:#fff;color:var(--tx)}
textarea{height:auto;min-height:72px;padding:8px 10px}
input[type=checkbox]{width:18px;height:18px;margin:0}
.fld{margin-bottom:12px}
.fld>label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--bd);background:#fff;font-size:13px;cursor:pointer;color:var(--tx)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.list .item,.item{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;cursor:pointer}
.chev{color:var(--mu);font-size:22px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:10px;background:#eef1ef;color:var(--mu);white-space:nowrap}
.t-ok{background:var(--g2);color:var(--g)}
.t-bad{background:var(--red2);color:var(--red)}
.t-warn{background:var(--or2);color:var(--or)}
.ph{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.ph div{position:relative}
.ph img,.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:6px;border:1px solid var(--bd);display:block}
.ph b{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;font-size:12px;cursor:pointer}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px}
.stat b{display:block;font-size:20px}
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--bd);border-radius:10px;margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f0f5f2;white-space:nowrap;position:sticky;top:0}
td.c,th.c{text-align:center}
.lich td{padding:0;text-align:center;min-width:30px;height:32px;cursor:default;border-left:1px solid #eef1ef}
.lich td.k{text-align:left;padding:4px 8px;white-space:nowrap;position:sticky;left:0;background:#fff;z-index:1;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.lich th{padding:4px 2px;text-align:center;font-weight:500}
.lich .cn{background:#f3f3f3}
.lich td.ed{cursor:pointer}
.lich td span{font-size:11px;font-weight:700;letter-spacing:.5px}
.cK{color:var(--g)}.cP{color:var(--red)}.cS{color:var(--or)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tabs button{flex:0 0 auto;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--g);background:#fff;color:var(--g);font-size:13px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--g);color:#fff}
.seg{display:flex;border:1px solid var(--g);border-radius:8px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;height:36px;border:0;background:#fff;color:var(--g);font-size:13px;cursor:pointer}
.seg button.on{background:var(--g);color:#fff}
.timeline{font-size:13px;white-space:pre-line;color:var(--mu)}
.badge{font-size:12px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.alert{border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px;background:var(--or2);color:#7a4a00}
.alert.err{background:var(--red2);color:var(--red)}
.alert.ok{background:var(--g2);color:var(--g)}
details{background:#fff;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px}
details summary{padding:10px 12px;cursor:pointer;font-weight:600;font-size:14px}
details .in{padding:0 12px 10px;font-size:13px}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.55);display:none;align-items:center;justify-content:center;z-index:20}
#loading div{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px 18px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#263b30;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;display:none;max-width:90%;text-align:center}
#toast.err{background:var(--red)}
.login{max-width:360px;margin:60px auto;padding:0 16px}
.login h2{color:var(--g);text-align:center;margin-bottom:4px}
#sync{display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:xoay .8s linear infinite;flex:0 0 14px}
@keyframes xoay{to{transform:rotate(360deg)}}
#who{display:none;background:#fdecea;color:#c0392b;border-radius:14px;padding:5px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.logo{text-align:center;font-size:34px;margin-bottom:4px}
.big{height:52px;font-size:16px;border-radius:12px;font-weight:600}
.userbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ava{width:42px;height:42px;border-radius:50%;background:var(--g2);color:var(--g);display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 42px}
.step{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.step.need{border-color:#e7a29a;box-shadow:0 0 0 3px var(--red2)}
.step.done{border-color:#bfe3cc}
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}

.kv.xong{opacity:.75}
.kv.blk{align-items:flex-start}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:0 0 22px}
.kv.xong .ck{background:#2e9e62;border-color:#2e9e62}

.tg button.onK{background:var(--g2);color:var(--g);border-color:var(--g)}
.tg button.onP{background:var(--red2);color:var(--red);border-color:var(--red)}

.dd-m button,.dd-m .ddl{display:block;width:100%;text-align:left;padding:13px 14px;border:0;border-bottom:1px solid #eef1ef;background:#fff;font-size:14px;color:var(--tx);cursor:pointer}

nav button.scan span{background:var(--g);color:#fff;border-radius:50%;width:46px;height:46px;line-height:46px;margin:-16px auto 1px;box-shadow:0 3px 10px rgba(0,0,0,.22);font-size:21px}

  .btn{height:44px}
  .btn-s{height:34px}

}

  .tem .qr img,.tem .qr canvas{width:26mm!important;height:26mm!important}
  .tem-t b{font-size:12pt}

}
</style>

<body>
<div id="app">
  <header><button id="back" onclick="goBack()">‹</button><h1 id="title">Giám sát kiểm soát côn trùng</h1><span id="sync" title="Đang cập nhật"></span><span id="who" onclick="ketNoiLai(true)">⚠ Mất mạng</span><button id="hdPill" onclick="go('hangDoi')"></button><button id="gpsPill" onclick="go('gpsHelp')"></button></header>
  <main id="main"><div style="color:#6b7a71;padding:20px 0">Đang khởi động… (phiên bản 02/11/2026)</div></main>
  <nav id="nav"></nav>
</div>
<div id="print"></div>
<div id="loading"><div>Đang xử lý…</div></div>
<div id="toast"></div>

<script>
/* ====== ĐỊA CHỈ MÁY CHỦ: dán link /exec của Apps Script vào giữa hai dấu nháy ====== */
const API = 'https://script.google.com/macros/s/AKfycbxscAunxFrnPKsdeUQPj-mvg0VG3Kn5TZW0oTruacvSvx8dMYjIA7_T-DsymGhKb5WCzw/exec';
/* ================================================================================== */
const QR_PARAM = (() => { try { return (new URLSearchParams(location.search).get('t') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 30); } catch (e) { return ''; } })();

/* ---------------- tiện ích ---------------- */
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let TOKEN = LS.get('kct_token') || '';
const TOC_DO = [];
let LOI_MANG = false, OFFLINE = false;
let LOI_CUOI = '', LECH_GIO = 0, GPS_LOI = null, GPS_WATCH = null;
let APP = null, CUR = null, STACK = [], PH = {}, F = {}, GPS = null, WM = '', QR_CHO = QR_PARAM, BUSY = 0;
const $ = s => document.querySelector(s);
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const q = k => !!(APP && APP.user.quyen[k]);
const dmy = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '';
const dm = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
const hm = s => s ? s.slice(11, 16) + ' ' + dm(s) : '';
const tien = n => Number(n || 0).toLocaleString('vi-VN') + ' đ';
const thangNay = () => APP.homNay.slice(0, 7);
const tenKhu = ma => { const k = APP.khu.find(x => x.ma === ma); return k ? k.ten : ma; };

function busy(on) { BUSY += on ? 1 : -1; if (BUSY < 0) BUSY = 0; $('#loading').style.display = BUSY ? 'flex' : 'none'; }
function toast(m, t) { const e = $('#toast'); e.textContent = m; e.className = t || ''; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', t === 'err' ? 5000 : 2800); }
async function call(a, p, quiet, imLang) {
  if (!quiet) busy(true);
  LOI_MANG = false;
  try {
    const ctl = window.AbortController ? new AbortController() : null;
    const hen = setTimeout(() => ctl && ctl.abort(), 45000);
    const t0 = Date.now();
    let res;
    try { res = await fetch(API, { method: 'POST', body: JSON.stringify({ token: TOKEN, action: a, p: p || {} }), signal: ctl ? ctl.signal : undefined }); }
    finally { clearTimeout(hen); }
    TOC_DO.push({ a, giay: (Date.now() - t0) / 1000 }); if (TOC_DO.length > 20) TOC_DO.shift();
    let j;
    try { j = await res.json(); } catch (e) { throw new Error('Máy chủ trả về dữ liệu lạ – kiểm tra link /exec và quyền truy cập "Bất kỳ ai" khi triển khai'); }
    if (OFFLINE) { OFFLINE = false; setTimeout(veMang, 0); }
    if (j.loi) throw new Error(j.loi);
    return j.kq;
  } catch (e) {
    let m = (e && e.message) || String(e);
    if (e && e.name === 'AbortError') { m = 'Máy chủ không phản hồi sau 45 giây – mạng yếu hoặc máy chủ đang bận'; LOI_MANG = true; }
    else if (/Failed to fetch|NetworkError|Load failed|network|internet/i.test(m) || navigator.onLine === false) { m = 'Không kết nối được máy chủ – đang mất mạng hoặc sóng yếu'; LOI_MANG = true; }
    LOI_CUOI = m;
    if (LOI_MANG && APP && !OFFLINE) { OFFLINE = true; setTimeout(veMang, 0); }
    if (/đăng nhập lại/.test(m)) { TOKEN = ''; LS.del('kct_token'); renderLogin(); }
    if (!imLang) toast(m, 'err');
    return null;
  } finally {
    if (!quiet) busy(false);
  }
}
function main(html) { $('#main').innerHTML = html; }
function setTitle(t) { $('#title').textContent = t; }
function thumbs(ids) {
  if (!ids) return '';
  return '<div class="thumbs">' + String(ids).split(',').filter(Boolean).map(id =>
    `<a href="https://drive.google.com/file/d/${h(id)}/view" target="_blank"><img loading="lazy" src="https://drive.google.com/thumbnail?id=${h(id)}&sz=w320"></a>`).join('') + '</div>';
}

/* ---------------- điều hướng ---------------- */
const PHIEN_BAN = '02/11/2026 (b)';
const PAGES = {};
let NAV_ON = 'home', BADGE_YC = 0, DD_TIEP = null;
function go(fn, args, push = true) {
  dungQuet();
  if (push && CUR) STACK.push(CUR);
  CUR = { fn, args: args || [] };
  window.scrollTo(0, 0);
  PAGES[fn](...CUR.args);
  $('#back').style.visibility = STACK.length ? 'visible' : 'hidden';
}
function goBack() {
  dungQuet();
  const p = STACK.pop();
  if (!p) return tab('home');
  CUR = p; window.scrollTo(0, 0); PAGES[p.fn](...p.args);
  $('#back').style.visibility = STACK.length ? 'visible' : 'hidden';
}
function tab(n) { STACK = []; CUR = null; renderNav(n); go(n, [], false); }
function laNCC() { return !!(APP && APP.user.donVi === 'NCC'); }
function navItems() {
  const it = [['home', '🏠', 'Hôm nay']];
  if (laNCC() && q('ThucHien')) it.push(['scan', '📷', 'Quét QR']);
  it.push(['yc', '🔔', 'Yêu cầu']);
  if (q('XemBaoCao')) it.push(['baoCao', '📊', 'Báo cáo']);
  it.push(['lich', '📅', 'Lịch']);
  it.push(['more', '☰', 'Thêm']);
  while (it.length > 5) it.splice(it.findIndex(x => x[0] === 'lich'), 1);
  return it;
}
function trongNav(n) { return navItems().some(x => x[0] === n); }
function renderNav(on) {
  if (on) NAV_ON = on;
  if (!APP) { $('#nav').innerHTML = ''; return; }
  $('#nav').innerHTML = navItems().map(i => `<button class="${i[0] === NAV_ON ? 'on' : ''} ${i[0] === 'scan' ? 'scan' : ''}" onclick="tab('${i[0]}')"><span>${i[1]}</span>${i[2]}${i[0] === 'yc' && BADGE_YC ? `<em class="nbadge">${BADGE_YC}</em>` : ''}</button>`).join('');
}

/* ---------------- bộ nhớ tạm trong máy: hiện ngay dữ liệu lần trước, cập nhật sau ---------------- */
let DONG_BO = 0;
function dongBo(n) { DONG_BO = Math.max(0, DONG_BO + n); const e = $('#sync'); if (e) e.style.display = DONG_BO ? 'inline-block' : 'none'; }
function ckey(k) { return 'kct_c_' + (APP ? APP.user.ten : '') + '_' + k; }
function cGet(k) { try { return JSON.parse(LS.get(ckey(k)) || 'null'); } catch (e) { return null; } }
function cSet(k, v) {
  try {
    const kk = ckey(k);
    LS.set(kk, JSON.stringify(v));
    let ds = []; try { ds = JSON.parse(LS.get('kct_ckeys') || '[]'); } catch (e) {}
    ds = ds.filter(x => x !== kk); ds.push(kk);
    while (ds.length > 25) LS.del(ds.shift());
    LS.set('kct_ckeys', JSON.stringify(ds));
  } catch (e) { /* bộ nhớ đầy */ }
}
/** Hiện dữ liệu đã lưu trong máy ngay lập tức, rồi lấy bản mới từ máy chủ và vẽ lại */
async function taiNhanh(k, action, p, ve) {
  const me = CUR, c = cGet(k);
  if (c) ve(c, true);
  if (OFFLINE) { if (!c) ve(null, true); return; }
  dongBo(1);
  const r = await call(action, p, true, true);
  dongBo(-1);
  if (me !== CUR) return;
  if (r) { cSet(k, r); ve(r, false); }
  else if (!c) ve(null, false);
  else if (!LOI_MANG) toast(LOI_CUOI, 'err');
}
function lamMoiTrang() {
  if (!CUR) return;
  if (['home', 'hangDoi', 'yc', 'khuCT', 'baoCao', 'more'].includes(CUR.fn)) PAGES[CUR.fn](...CUR.args);
}

/* ---------------- đăng nhập ---------------- */
function renderLogin() {
  APP = null;
  $('#nav').innerHTML = ''; $('#who').style.display = 'none'; setTitle('Giám sát kiểm soát côn trùng'); $('#back').style.visibility = 'hidden'; $('#gpsPill').style.display = 'none'; $('#hdPill').style.display = 'none';
  const tenCu = LS.get('kct_user') || '';
  main(`<form class="login" onsubmit="dangNhap();return false" autocomplete="on"><div class="logo">🐀🦟🐍</div><h2>Đăng nhập</h2><p class="muted" style="text-align:center">Giám sát dịch vụ kiểm soát chuột – côn trùng – rắn<br>Sun World Fansipan Legend</p>
    <div class="fld"><label>Tên đăng nhập</label><input id="lu" name="username" autocomplete="username" autocapitalize="off" value="${h(tenCu)}"></div>
    <div class="fld"><label>Mật khẩu</label><input id="lp" name="password" type="password" autocomplete="current-password"></div>
    <div class="fld"><label class="row" style="font-weight:400"><input type="checkbox" id="lnho" checked> Ghi nhớ đăng nhập trên máy này</label></div>
    <button class="btn btn-block big" type="submit">Đăng nhập</button><div class="muted" style="text-align:center;margin-top:10px">Phiên bản ${PHIEN_BAN}</div></form>`);
  if (tenCu) setTimeout(() => $('#lp') && $('#lp').focus(), 50);
}
async function dangNhap() {
  const nho = $('#lnho').checked;
  const r = await call('dangNhap', { u: $('#lu').value, p: $('#lp').value, nho });
  if (!r) return;
  TOKEN = r.token;
  LS.set('kct_user', $('#lu').value.trim());
  if (nho) LS.set('kct_token', TOKEN); else LS.del('kct_token');
  LS.del('kct_app');
  start();
}
function apDungApp(r) {
  const coMatCu = APP && APP.homNay === r.homNay ? APP.coMatHom : '';
  APP = r;
  if (!APP.coMatHom && coMatCu) APP.coMatHom = coMatCu;
  if (r.token) { TOKEN = r.token; if (LS.get('kct_token')) LS.set('kct_token', TOKEN); }
  LECH_GIO = r.gioMay - Date.now();
  LS.set('kct_lech', String(LECH_GIO));
  try { const c = Object.assign({}, r); delete c.token; c.luuLuc = Date.now(); LS.set('kct_app', JSON.stringify(c)); } catch (e) {}
}
function moDau() {
  veMang(); capNhatHD(); batGPS();
  if (QR_CHO) {
    const c = QR_CHO; QR_CHO = '';
    renderNav('home');
    STACK = [{ fn: 'home', args: [] }]; CUR = null;
    return c.includes('-') ? go('tramCT', [c, 'QR'], false) : go('khuCT', [c, 'QR'], false);
  }
  tab('home');
}
async function start() {
  if (/DAN_LINK_EXEC/.test(API)) return main('<div class="card" style="margin-top:20px"><b style="color:var(--red)">Chưa khai báo địa chỉ máy chủ</b><div style="margin-top:6px">Mở file index.html, tìm dòng <code>const API = ...</code> và dán link /exec của Apps Script vào.</div></div>');
  if (QR_CHO) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  if (!TOKEN) return renderLogin();
  let cu = null;
  try { cu = JSON.parse(LS.get('kct_app') || 'null'); } catch (e) { cu = null; }
  if (cu && cu.user) {
    APP = cu; LECH_GIO = +LS.get('kct_lech') || 0;
    moDau();
  } else main('<div class="muted" style="padding:20px 0">Đang tải dữ liệu…</div>');
  dongBo(1);
  const r = await call('khoiTao', {}, true, true);
  dongBo(-1);
  if (r) {
    OFFLINE = false;
    const daCo = !!(cu && cu.user);
    apDungApp(r);
    veMang();
    if (!daCo) moDau(); else { renderNav(); if (CUR && CUR.fn === 'home') PAGES.home(); }
    napJsQR().catch(() => {});
    setTimeout(() => guiHangDoi(false), 1500);
    return;
  }
  if (!TOKEN) return;
  if (LOI_MANG && cu && cu.user) { OFFLINE = true; veMang(); toast('Đang mất mạng – dùng dữ liệu đã lưu trong máy'); if (CUR && CUR.fn === 'home') PAGES.home(); return; }
  if (cu && cu.user) { toast(LOI_CUOI, 'err'); return; }
  main(`<div class="card" style="margin-top:20px"><b style="color:var(--red)">Không mở được ứng dụng</b>
    <div style="margin:8px 0">${h(LOI_CUOI)}</div>
    <div class="muted" style="margin-bottom:10px">${LOI_MANG ? 'Lần đầu mở app cần có mạng để tải danh mục.' : 'Nếu báo thiếu trang: trong Apps Script chạy lại hàm caiDat.'}</div>
    <div class="row"><button class="btn" onclick="start()">Thử lại</button><button class="btn btn-o" onclick="dangXuat()">Đăng nhập lại</button></div></div>`);
}
let DANG_KN = false;
/** Đang mất mạng: thử kết nối lại định kỳ; có mạng thì cập nhật danh mục, gửi bản ghi chờ, vẽ lại màn hình */
async function ketNoiLai(thongBao) {
  if (DANG_KN || !TOKEN || !APP) return;
  DANG_KN = true;
  const r = await call('khoiTao', {}, true, true);
  DANG_KN = false;
  if (!r) { if (thongBao) toast('Vẫn chưa có mạng', 'err'); return; }
  const daOffline = OFFLINE;
  OFFLINE = false; apDungApp(r); veMang(); renderNav();
  if (daOffline) toast('Đã có mạng trở lại');
  await guiHangDoi(false);
  lamMoiTrang();
}

/* ---------------- LÀM VIỆC KHI MẤT MẠNG ---------------- */
if ('serviceWorker' in navigator && /^https:|^http:\/\/localhost/.test(location.href)) navigator.serviceWorker.register('sw.js').catch(() => {});
const HD = {
  db: null,
  mo() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('kct', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('hangdoi', { keyPath: 'maGhi' });
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error || new Error('Không mở được bộ nhớ máy'));
    });
  },
  async lam(mode, fn) {
    const db = await this.mo();
    return new Promise((res, rej) => {
      const tx = db.transaction('hangdoi', mode);
      const rq = fn(tx.objectStore('hangdoi'));
      tx.oncomplete = () => res(rq ? rq.result : undefined);
      tx.onerror = () => rej(tx.error);
    });
  },
  them(x) { return this.lam('readwrite', st => st.put(x)); },
  xoa(k) { return this.lam('readwrite', st => st.delete(k)); },
  tatCa() { return this.lam('readonly', st => st.getAll()).then(a => a || []); }
};
function veMang() {
  const w = $('#who');
  if (w) w.style.display = APP && (OFFLINE || navigator.onLine === false) ? 'inline-block' : 'none';
}
async function capNhatHD() {
  let n = 0;
  try { n = (await HD.tatCa()).filter(x => !APP || x.ai === APP.user.ten).length; } catch (e) {}
  const p = $('#hdPill');
  if (p) { p.style.display = n ? 'inline-block' : 'none'; p.textContent = '📤 ' + n; p.title = n + ' bản ghi chờ gửi'; }
  return n;
}
/** Gửi một lượt ghi nhận hiện trường; mất mạng thì lưu vào máy để gửi sau */
async function guiGhiNhan(btn, action, payload, okMsg, moTa) {
  payload.maGhi = 'G' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  payload.tgGhi = bayGio().getTime();
  if (btn) btn.disabled = true;
  let r = null;
  LOI_MANG = false;
  if (!OFFLINE && navigator.onLine !== false) r = await call(action, payload, false, true);
  else LOI_MANG = true;
  if (btn) btn.disabled = false;
  if (r) { toast(okMsg); return r; }
  if (!LOI_MANG) { toast(LOI_CUOI, 'err'); return null; }
  try {
    await HD.them({ maGhi: payload.maGhi, action, p: Object.assign({}, payload, { offline: true }), moTa, luc: payload.tgGhi, ai: APP.user.ten, loi: '' });
  } catch (e) { toast('Không lưu được vào máy: ' + e.message, 'err'); return null; }

function batGPS() {
  const pill = $('#gpsPill'); pill.style.display = 'inline-block';
  if (!navigator.geolocation) { GPS_LOI = 'Thiết bị không hỗ trợ định vị'; return veGPS(); }
  if (GPS_WATCH !== null) navigator.geolocation.clearWatch(GPS_WATCH);
  GPS_LOI = null; veGPS();
  GPS_WATCH = navigator.geolocation.watchPosition(p => {
    GPS = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), luc: Date.now() };
    GPS_LOI = null; veGPS();
  }, e => {
    GPS_LOI = e.code === 1 ? 'Trình duyệt chưa được cho phép dùng vị trí' : e.code === 2 ? 'Điện thoại đang tắt định vị (GPS) hoặc không bắt được tín hiệu' : 'Chưa lấy được vị trí, đang thử lại…';

}
function gpsMoi() { return GPS && Date.now() - GPS.luc < 120000; }
/** Vùng chứa vị trí: Ga đi / Ga đến / TTTM Sunplaza / Ngoài khu du lịch */
function vungCua(g) {
  if (!g) return '';
  const ds = (APP && APP.vung || []).filter(v => v.lat);
  if (!ds.length) return '';
  const R = 6371000, r = Math.PI / 180;
  let tot = null, kc = Infinity;
  ds.forEach(v => {
    const x = Math.sin((v.lat - g.lat) * r / 2) ** 2 + Math.cos(g.lat * r) * Math.cos(v.lat * r) * Math.sin((v.lng - g.lng) * r / 2) ** 2;
    const d = 2 * R * Math.asin(Math.sqrt(x));
    if (d <= v.r + Math.min(g.acc || 0, 100) && d < kc) { tot = v; kc = d; }
  });
  return tot ? tot.ten : 'Ngoài khu du lịch';
}
function veGPS() {
  const pill = $('#gpsPill');
  if (pill) {
    if (gpsMoi()) { const v = vungCua(GPS); pill.className = v === 'Ngoài khu du lịch' ? 'wait' : 'on'; pill.textContent = '📍 ' + (v || 'GPS ±' + GPS.acc + 'm'); }
    else if (GPS_LOI && !/thử lại/.test(GPS_LOI)) { pill.className = 'off'; pill.textContent = '📍 GPS tắt'; }
    else { pill.className = 'wait'; pill.textContent = '📍 Đang dò…'; }
  }
  const el = $('#gps');
  if (el) el.innerHTML = gpsMoi() ? `📍 Đang ở: <b>${h(vungCua(GPS) || 'đã có vị trí')}</b> <span class="muted">(sai số ±${GPS.acc} m)</span>`
    : GPS_LOI && !/thử lại/.test(GPS_LOI) ? `<span style="color:var(--red)">⚠️ ${h(GPS_LOI)}.</span> <a href="#" onclick="go('gpsHelp');return false">Cách bật</a>`
    : '📍 Đang lấy vị trí…';
}

/** Nén ảnh và đóng dấu cố định: ngày giờ (giờ máy chủ), vị trí, tọa độ GPS, người chụp */
function nenAnh(file, g) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, hh = img.naturalHeight; const sc = Math.min(1, 1280 / Math.max(w, hh));
      w = Math.round(w * sc); hh = Math.round(hh * sc);
      const c = document.createElement('canvas'); c.width = w; c.height = hh; const x = c.getContext('2d');
      x.drawImage(img, 0, 0, w, hh);
      const d = bayGio(), p2 = n => String(n).padStart(2, '0');
      const thu = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'][d.getDay()];
      const dong = [
        { t: `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}  ${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${d.getFullYear()}`, to: 1.55, dam: 1 },
        { t: thu + (WM ? '  ·  ' + WM : ''), to: 1 },
        (() => { const v = vungCua(g); return { t: !g ? '📍 KHÔNG CÓ VỊ TRÍ GPS' : '📍 ' + (v === 'Ngoài khu du lịch' ? 'NGOÀI KHU DU LỊCH' : v ? v + ' – Sun World Fansipan Legend' : 'Đã định vị (vùng chưa thiết lập)'), to: 1.15, dam: 1, mau: !g || v === 'Ngoài khu du lịch' ? '#ffb3a8' : '#ffe27a' }; })(),
        { t: 'Người chụp: ' + APP.user.hoTen + (g ? `  ·  ${g.lat.toFixed(5)}, ${g.lng.toFixed(5)} ±${g.acc}m` : ''), to: .8 }
      ];
      const fs = Math.max(15, Math.round(Math.min(w, hh) / 26));
      const pad = Math.round(fs * .7);
      let cao = pad;
      dong.forEach(l => cao += fs * l.to * 1.32);
      cao += pad * .5;
      x.fillStyle = 'rgba(0,0,0,.58)'; x.fillRect(0, hh - cao, w, cao);
      x.fillStyle = '#f5b800'; x.fillRect(0, hh - cao, Math.max(4, Math.round(fs / 4)), cao);
      let y = hh - cao + pad;
      x.textBaseline = 'top'; x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = 3;
      dong.forEach(l => {
        x.font = `${l.dam ? '700 ' : ''}${Math.round(fs * l.to)}px Roboto, "Helvetica Neue", Arial, sans-serif`;
        x.fillStyle = l.mau || '#fff';
        x.fillText(l.t, pad + 4, y, w - pad * 2);
        y += fs * l.to * 1.32;
      });
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .7));
    };

  });
}

function dongKhu(l, ncc) {

let LICH = null, LICH_NGAY = null, LICH_CHE = 'ngay', LICH_SUA = false, LICH_DOI = false;

function ngayThang(thang) {
  const y = +thang.slice(0, 4), m = +thang.slice(5, 7), n = new Date(y, m, 0).getDate();
  const thu = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
  const out = [];

}
function veLich(canhBao) {
  if (canhBao !== undefined) LICH.cb = canhBao;

  const cb = LICH.cb;
  if (cb && cb.length) s += `<details><summary style="color:var(--or)">⚠ Lịch chưa đúng tần suất PL02 (${cb.length})</summary><div class="in">${cb.map(c => '• ' + h(c)).join('<br>')}</div></details>`;

}
function veLichNgay() {
  const { thang, map } = LICH;
  const days = ngayThang(thang);
  if (!LICH_NGAY || LICH_NGAY.slice(0, 7) !== thang) LICH_NGAY = homStr().slice(0, 7) === thang ? homStr() : thang + '-01';
  const ds = LICH_NGAY, ed = q('NhapLich');

  }).join('')}</div>`;
  const coViec = APP.khu.filter(k => (map[k.ma] || {})[ds]);

    ${ed ? `<button class="btn ${LICH_SUA ? '' : 'btn-o'} btn-s" onclick="LICH_SUA=!LICH_SUA;veLich()">${LICH_SUA ? '✓ Xong' : '✏️ Sửa ngày này'}</button>` : ''}</div>

  const ds2 = LICH_SUA ? APP.khu : coViec;

/* ---- nhập lịch từ Excel ---- */
let NHAP = null;
function chuThuong(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'd').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
function giaTri(cell) {
  const v = cell.value;
  if (v === null || v === undefined) return '';
  if (typeof v === 'object') {
    if (v instanceof Date) return v.toISOString();
    if (v.richText) return v.richText.map(t => t.text).join('');
    if (v.result !== undefined) return String(v.result);
    if (v.text !== undefined) return String(v.text);
    return '';
  }
  return String(v);
}
function laMauDo(argb) {
  if (!argb || argb.length < 8) return false;
  const r = parseInt(argb.slice(2, 4), 16), g = parseInt(argb.slice(4, 6), 16), b = parseInt(argb.slice(6, 8), 16);
  return r > 170 && g < 110 && b < 110;
}
function laNenCam(argb) {
  if (!argb || argb.length < 8) return false;
  const r = parseInt(argb.slice(2, 4), 16), g = parseInt(argb.slice(4, 6), 16), b = parseInt(argb.slice(6, 8), 16);
  return r > 220 && g > 120 && g < 220 && b < 90;
}
/** Đọc 1 ô lịch thành chuỗi K/P/S */
function docO(cell) {
  const t = giaTri(cell).trim();
  if (!t) return '';
  const chu = t.toUpperCase().replace(/[\s,+;\/&-]/g, '');
  if (/^[KPS]+$/.test(chu)) return ['K', 'P', 'S'].filter(c => chu.includes(c)).join('');
  // Kiểu file NCC: ô đánh dấu (■, x, ✓…). Chữ đỏ hoặc nền cam = phun, còn lại = kiểm tra
  let mauChu = cell.font && cell.font.color && cell.font.color.argb;
  if (cell.value && cell.value.richText) { const run = cell.value.richText.find(x => x.font && x.font.color && x.font.color.argb); if (run) mauChu = run.font.color.argb; }
  const mauNen = cell.fill && cell.fill.fgColor && cell.fill.fgColor.argb;
  return laMauDo(mauChu) || laNenCam(mauNen) ? 'P' : 'K';
}
function docTrangLich(ws, thangMacDinh) {
  // 1. dòng số ngày
  let hang = 0, cotNgay = {};
  for (let r = 1; r <= Math.min(ws.rowCount, 20) && !hang; r++) {
    const row = ws.getRow(r), map = {};
    row.eachCell({ includeEmpty: false }, (c, col) => { const v = giaTri(c).trim(); if (/^\d{1,2}$/.test(v) && +v >= 1 && +v <= 31) map[col] = +v; });
    const ds = Object.values(map);
    if (ds.length >= 28 && ds.includes(1)) { hang = r; cotNgay = map; }
  }
  if (!hang) throw new Error('Không tìm thấy dòng số ngày (1, 2, 3… 31) trong trang "' + ws.name + '"');
  const cotDau = Math.min(...Object.keys(cotNgay).map(Number));
  // 2. tháng
  let thang = '';
  for (let r = 1; r < hang && !thang; r++) ws.getRow(r).eachCell(c => {
    const v = giaTri(c);
    let m = v.match(/(\d{4})-(\d{2})/); if (m && !thang) thang = m[1] + '-' + m[2];
    m = v.match(/(\d{1,2})\s*[\/.\-]\s*(\d{4})/); if (m && !thang) thang = m[2] + '-' + String(m[1]).padStart(2, '0');
  });
  if (!thang) { const m = ws.name.match(/(\d{1,2})[.\-_](\d{2,4})/); if (m) thang = (m[2].length === 2 ? '20' + m[2] : m[2]) + '-' + m[1].padStart(2, '0'); }
  const thangTuFile = !!thang;
  if (!thang) thang = thangMacDinh;
  const soNgay = new Date(+thang.slice(0, 4), +thang.slice(5, 7), 0).getDate();
  // 3. từng dòng khu
  const maKhu = new Set(APP.khu.map(k => k.ma));
  const theoTen = APP.khu.map(k => ({ ma: k.ma, t: chuThuong(k.ten) }));
  let nhom = '';
  const kq = { thang, thangTuFile, map: {}, khop: 0, boQua: [], khongKhop: [], dem: { K: 0, P: 0, S: 0 } };
  for (let r = hang + 1; r <= ws.rowCount; r++) {
    const row = ws.getRow(r);
    const dau = [];
    for (let c = 1; c < cotDau; c++) dau.push(giaTri(row.getCell(c)).trim());
    const ten = dau.filter(Boolean).join(' ');
    if (!ten) continue;
    const o = {};
    Object.keys(cotNgay).forEach(col => { const d = cotNgay[col]; if (d > soNgay) return; const v = docO(row.getCell(+col)); if (v) o[thang + '-' + String(d).padStart(2, '0')] = v; });
    // mã khu ghi sẵn
    let ma = dau.find(x => maKhu.has(x.toUpperCase()));
    ma = ma ? ma.toUpperCase() : '';
    const stt = dau.find(x => /^\d{1,2}$/.test(x));
    const tn = chuThuong(ten);
    if (!ma && !stt && !Object.keys(o).length) {
      // dòng tiêu đề nhóm
      if (/sunhome/.test(tn)) nhom = 'X';
      else if (/ga di\b/.test(tn)) nhom = 'C';
      else if (/fansipan|ga den/.test(tn)) nhom = 'B';
      else if (/sapa|sa pa|tttm/.test(tn)) nhom = 'A';
      continue;
    }
    if (!ma && nhom === 'X') { if (Object.keys(o).length) kq.boQua.push(ten); continue; }
    if (!ma && stt && nhom) { const thu = nhom + String(stt).padStart(2, '0'); if (maKhu.has(thu)) ma = thu; }
    const tn2 = tn.replace(/^\d+ /, '');
    if (!ma && tn2.length >= 4) { const t = theoTen.find(k => tn2 === k.t || tn2.includes(k.t) || k.t.includes(tn2)); if (t) ma = t.ma; }
    if (!ma) { if (Object.keys(o).length) kq.khongKhop.push(ten); continue; }
    kq.khop++;
    kq.map[ma] = Object.assign(kq.map[ma] || {}, o);
    Object.values(o).forEach(v => v.split('').forEach(c => kq.dem[c]++));
  }
  return kq;
}

/* ================= QUÉT MÃ QR TRONG APP ================= */
let SCAN = null;
PAGES.scan = async function () {
  if (chanDiemDanh({ fn: 'scan', args: [] })) return;
  setTitle('Quét mã QR');
  main('<div class="card" style="padding:0;overflow:hidden;position:relative;background:#000">'
    + '<video id="sv" playsinline muted autoplay style="width:100%;display:block;max-height:58vh;object-fit:cover"></video>'
    + '<div style="position:absolute;left:18%;right:18%;top:18%;bottom:18%;border:3px solid rgba(255,255,255,.85);border-radius:12px"></div></div>'
    + '<div id="sm" class="muted" style="margin-bottom:10px">Đang mở camera… đưa tem QR vào giữa khung.</div>'
    + '<label class="btn btn-o btn-block"><input type="file" accept="image/*" capture="environment" hidden onchange="quetAnh(this)">📷 Chụp ảnh tem (nếu camera không mở)</label>'
    + '<div class="fld"><label>Hoặc nhập mã (tem hỏng)</label><div class="row"><input id="sma" placeholder="VD: C15-001 hoặc C15" autocapitalize="characters"><button class="btn" onclick="moMa($(\'#sma\').value,\'Tay\')">Mở</button></div></div>');
  const me = CUR;
  try { await napJsQR(); } catch (e) { if ($('#sm')) $('#sm').textContent = e.message; return; }
  if (me !== CUR) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('#sm').textContent = 'Trình duyệt không mở được camera trực tiếp – dùng nút chụp ảnh tem.'; return; }
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    const v = $('#sv');
    if (me !== CUR || !v) { st.getTracks().forEach(t => t.stop()); return; }
    SCAN = { st, t: null };
    v.srcObject = st;
    try { await v.play(); } catch (e) {}
    $('#sm').textContent = 'Đưa tem QR vào giữa khung…';
    const c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently: true });
    const vong = () => {
      if (!SCAN || !document.body.contains(v)) return dungQuet();
      if (v.readyState >= 2 && v.videoWidth) {
        const sc = Math.min(1, 720 / Math.max(v.videoWidth, v.videoHeight));
        c.width = Math.round(v.videoWidth * sc); c.height = Math.round(v.videoHeight * sc);
        x.drawImage(v, 0, 0, c.width, c.height);
        const kq = jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'dontInvert' });
        if (kq && kq.data) { if (navigator.vibrate) navigator.vibrate(80); return moMa(kq.data, 'QR'); }
      }
      SCAN.t = setTimeout(vong, 160);
    };
    vong();
  } catch (e) {
    if ($('#sm')) $('#sm').innerHTML = '<span style="color:var(--red)">Không mở được camera (' + h(e.message) + ').</span> Cho phép Camera cho trang này, hoặc dùng nút chụp ảnh tem bên dưới.';
  }
};
function dungQuet() {
  if (!SCAN) return;
  clearTimeout(SCAN.t);
  try { SCAN.st.getTracks().forEach(t => t.stop()); } catch (e) {}
  SCAN = null;
}
function maTuQR(raw) {
  const s = String(raw || '').trim();
  const m = s.match(/[?&]t=([A-Za-z0-9_-]+)/);
  return (m ? m[1] : s).toUpperCase().replace(/[^A-Z0-9-]/g, '');
}
function moMa(raw, cach) {
  const c = maTuQR(raw);
  if (!c) return toast('Không đọc được mã', 'err');
  const laTram = c.includes('-');
  if (laTram ? !APP.tram.some(t => t.ma === c) : !APP.khu.some(k => k.ma === c)) { toast('Không tìm thấy ' + (laTram ? 'trạm ' : 'khu ') + c + ' trong danh mục', 'err'); return; }
  dungQuet();
  if (CUR && CUR.fn === 'scan') CUR = STACK.pop() || null;
  go(laTram ? 'tramCT' : 'khuCT', [c, cach || 'QR']);
}
async function quetAnh(inp) {
  const f = inp.files[0]; inp.value = '';
  if (!f) return;
  busy(true);
  try {
    await napJsQR();
    const url = URL.createObjectURL(f);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Không đọc được ảnh')); i.src = url; });
    let kq = null;
    for (const max of [1000, 1600, 700]) {
      const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
      kq = jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
      if (kq) break;
    }
    URL.revokeObjectURL(url);
    busy(false);
    if (!kq) return toast('Không thấy mã QR trong ảnh – chụp gần và rõ hơn', 'err');
    moMa(kq.data, 'QR');
  } catch (e) { busy(false); toast(e.message, 'err'); }
}

function gioStr(m) { const ng = Math.floor(m / 1440); m = Math.round(m % 1440); return p2(Math.floor(m / 60)) + ':' + p2(m % 60) + (ng ? ' hôm sau' : ''); }

  const m = phutStr(gio), bd = phutStr(c.SLA_NgayBatDau || '08:00'), kt = phutStr(c.SLA_NgayKetThuc || '18:30');
  if (m >= bd && m < kt) {

  main(`<div class="alert">Xuất toàn bộ lịch sử kiểm tra trạm, kiểm tra khu, phun, điểm danh, yêu cầu phát sinh trong <b>khoảng ngày bất kỳ</b> (tối đa 1 năm/lần) – kèm giờ, người thực hiện, vùng GPS và link ảnh minh chứng.</div>

      <div class="chips">${nhanh.map(x => `<button class="chip ${L.tu === x[1] && L.den === x[2] ? 'on' : ''}" onclick="XD_LOC.tu='${x[1]}';XD_LOC.den='${x[2]}';XD=null;PAGES.xuatDL()">${x[0]}</button>`).join('')}</div></div>
    <div class="card"><b>Loại dữ liệu</b><div style="margin-top:6px">${XD_LOAI.map(x => `<label class="row" style="font-weight:400;margin:8px 0"><input type="checkbox" class="xLoai" value="${x[0]}" ${L.loai.includes(x[0]) ? 'checked' : ''}> ${x[1]}</label>`).join('')}</div></div>
    <div class="card"><b>Lọc (không bắt buộc)</b><div class="fld" style="margin-top:8px"><label>Khu vực</label>${khuSelect('xKhu', L.khu, 'Tất cả khu vực')}</div>
      <div class="fld"><label>Mã trạm (xem lịch sử 1 trạm)</label><input id="xTram" value="${h(L.tram)}" placeholder="VD: C15-001" autocapitalize="characters"></div></div>
    <div class="mrow"><button class="btn btn-o big" onclick="layXD(this,false)">👁 Xem trên app</button><button class="btn big" onclick="layXD(this,true)">⬇ Tải Excel</button></div>
    <div id="xdKq"></div>`);
  if (XD) veXD();
};
function docXD() {
  XD_LOC = { tu: $('#xTu').value, den: $('#xDen').value, loai: [...document.querySelectorAll('.xLoai:checked')].map(x => x.value), khu: $('#xKhu').value, tram: $('#xTram').value.trim().toUpperCase() };
  return XD_LOC;
}
async function layXD(b, excel) {
  const L = docXD();
  if (!L.tu || !L.den || L.den < L.tu) return toast('Chọn khoảng ngày hợp lệ', 'err');
  if (!L.loai.length) return toast('Chọn ít nhất một loại dữ liệu', 'err');
  const r = await gui(b, 'xuatDuLieu', L);
  if (!r) return;
  XD = r; XD_SO = 60;
  veXD();
  if (excel) await xuatXDExcel(b);
}
function veXD() {
  const r = XD, e = $('#xdKq'); if (!e) return;
  const ds = nkDs(r);
  const dem = [['Kiểm tra trạm', r.tram.length], ['Kiểm tra khu', r.khu.length], ['Phun', r.phun.length], ['Điểm danh', r.coMat.length], ['Yêu cầu', (r.yeuCau || []).length]];
  let s = `<div class="card"><div class="row sb"><b>${dmy(r.tu)} – ${dmy(r.den)}</b><button class="btn btn-s" onclick="xuatXDExcel(this)">⬇ Excel</button></div>
    <div class="muted">${r.khuLoc ? 'Khu ' + h(r.khuLoc) + ' · ' : ''}${r.tramLoc ? 'Trạm ' + h(r.tramLoc) + ' · ' : ''}${ds.length} lượt ghi nhận</div>
    <div class="tags" style="margin-top:6px">${dem.map(x => `<span class="tag ${x[1] ? 't-ok' : ''}">${x[0]}: ${x[1]}</span>`).join('')}</div></div>`;
  s += ds.slice(0, XD_SO).map(nkCard).join('');
  if (ds.length > XD_SO) s += `<button class="btn btn-o btn-block" onclick="XD_SO+=60;veXD()">Xem thêm (${ds.length - XD_SO})</button>`;
  if ((r.yeuCau || []).length) s += '<div class="grp">Yêu cầu phát sinh</div>' + r.yeuCau.map(y => `<div class="card"><div class="row sb"><b>${h(y[0])} · ${h(y[5])}</b><span class="tag ${y[13] ? 't-bad' : ''}">${h(y[12])}${y[13] ? ' · trễ' : ''}</span></div><div>${h(y[3])} – ${h(tenKhu(y[3]))}: ${h(y[6])}</div><div class="muted">Tạo ${hm(y[1])} · hạn ${hm(y[7])}${y[8] ? ' · có mặt ' + hm(y[8]) : ''}</div>${thumbs(y[15])}</div>`).join('');
  e.innerHTML = s;
}
async function xuatXDExcel(b) {
  if (!XD) return;
  if (b) b.disabled = true;
  try {
    await napExcel();
    const r = XD;
    const wb = new ExcelJS.Workbook(); wb.creator = APP.user.hoTen; wb.created = new Date();
    const ten = XD_LOAI.filter(x => XD_LOC.loai.includes(x[0])).map(x => x[1]).join(', ');
    const ws = trangBang(wb, 'Thông tin', 'DỮ LIỆU GIÁM SÁT DỊCH VỤ KIỂM SOÁT CÔN TRÙNG', [{ h: 'Nội dung', w: 30 }, { h: 'Giá trị', w: 70 }], [
      ['Khoảng ngày', dmy(r.tu) + ' – ' + dmy(r.den)], ['Loại dữ liệu', ten], ['Khu vực', r.khuLoc ? r.khuLoc + ' – ' + tenKhu(r.khuLoc) : 'Tất cả'], ['Mã trạm', r.tramLoc || 'Tất cả'],
      ['Số lượt kiểm tra trạm', r.tram.length], ['Số lượt kiểm tra khu', r.khu.length], ['Số lần phun', r.phun.length], ['Số lượt điểm danh', r.coMat.length], ['Số yêu cầu phát sinh', (r.yeuCau || []).length],
      ['Người xuất', r.nguoiXuat], ['Thời điểm xuất', r.luc], ['Ghi chú', 'Cột "Ảnh" là link xem ảnh gốc trên Google Drive (ảnh có đóng dấu giờ, vị trí, người chụp).']]);
    // tổng hợp theo khu
    const tk = {};
    APP.khu.forEach(k => tk[k.ma] = { kt: 0, ngay: new Set(), kk: 0, dk: 0, sa: 0, bs: 0 });
    r.tram.forEach(x => { const t = tk[x[1]]; if (t) { t.kt++; t.ngay.add(x[0].slice(0, 10)); } });
    r.khu.forEach(x => { const t = tk[x[1]]; if (t) { t.kk++; t.ngay.add(x[0].slice(0, 10)); } });
    r.phun.forEach(x => { const t = tk[x[1]]; if (t) { if (x[3] === 'Định kỳ') t.dk++; else if (x[3] === 'Tinh dầu sả') t.sa++; else t.bs++; } });
    trangBang(wb, 'Tổng hợp theo khu', 'TỔNG HỢP THEO KHU – ' + dmy(r.tu) + ' đến ' + dmy(r.den), [{ h: 'Mã khu', w: 8, c: 1 }, { h: 'Khu vực', w: 46 }, { h: 'Lượt quét trạm', w: 10, c: 1 }, { h: 'Lượt kiểm tra khu', w: 10, c: 1 }, { h: 'Số ngày có kiểm tra', w: 10, c: 1 }, { h: 'Phun định kỳ', w: 9, c: 1 }, { h: 'Tinh dầu sả', w: 9, c: 1 }, { h: 'Phun bổ sung', w: 9, c: 1 }],
      APP.khu.filter(k => !r.khuLoc || k.ma === r.khuLoc).map(k => { const t = tk[k.ma]; return [k.ma, k.ten, t.kt, t.kk, t.ngay.size, t.dk, t.sa, t.bs]; }));
    themNK(wb, r);
    await taiXuong(wb, `DuLieu_KSCT_${r.tu}_${r.den}${r.khuLoc ? '_' + r.khuLoc : ''}${r.tramLoc ? '_' + r.tramLoc : ''}.xlsx`);
  } catch (e) { toast(e.message, 'err'); }
  if (b) b.disabled = false;
}
/** Các trang nhật ký chi tiết trong file Excel (dùng chung cho báo cáo tháng và xuất dữ liệu) */
function themNK(wb, nk) {
  if (nk.tram.length || !nk.yeuCau) trangBang(wb, 'NK kiểm tra trạm', null, [{ h: 'Thời gian', w: 18 }, { h: 'Khu', w: 7, c: 1 }, { h: 'Trạm', w: 10 }, { h: 'Người thực hiện', w: 18 }, { h: 'Cách ghi', w: 9 }, { h: 'Tình trạng bả', w: 12 }, { h: 'Thay bả', w: 8, c: 1 }, { h: 'Dấu hiệu', w: 18 }, { h: 'Tình trạng trạm', w: 13 }, { h: 'Ghi chú', w: 24 }, { h: 'Vùng định vị', w: 16 }, { h: 'GPS', w: 24 }, { h: 'Ảnh', w: 12 }, { h: 'Cách gửi', w: 18 }],
    nk.tram.map(x => x.slice(0, 12).concat([linkAnh(x[12]), x[13]])), { to: row => row[4] === 'Nhập tay' ? XL.cam : null });
  if (nk.khu.length || !nk.yeuCau) trangBang(wb, 'NK kiểm tra khu', null, [{ h: 'Thời gian', w: 18 }, { h: 'Khu', w: 7, c: 1 }, { h: 'Người thực hiện', w: 18 }, { h: 'Cách ghi', w: 9 }, { h: 'Côn trùng', w: 11 }, { h: 'Rắn', w: 12 }, { h: 'Xác chuột', w: 8, c: 1 }, { h: 'Đã xử lý', w: 26 }, { h: 'Ghi chú', w: 26 }, { h: 'GPS', w: 24 }, { h: 'Ảnh', w: 12 }, { h: 'Vùng định vị', w: 16 }, { h: 'Cách gửi', w: 18 }],
    nk.khu.map(x => x.slice(0, 10).concat([linkAnh(x[10]), x[11], x[12]])));
  if (nk.phun.length || !nk.yeuCau) trangBang(wb, 'NK phun', null, [{ h: 'Thời gian', w: 18 }, { h: 'Khu', w: 7, c: 1 }, { h: 'Người thực hiện', w: 18 }, { h: 'Loại phun', w: 16 }, { h: 'Hóa chất (PL01)', w: 28 }, { h: 'Ngoài danh mục', w: 18 }, { h: 'Khung giờ', w: 10 }, { h: 'Ghi chú', w: 24 }, { h: 'GPS', w: 24 }, { h: 'Ảnh', w: 12 }, { h: 'Vùng định vị', w: 16 }, { h: 'Cách gửi', w: 18 }],
    nk.phun.map(x => x.slice(0, 9).concat([linkAnh(x[9]), x[10], x[11]])), { to: row => row[5] || row[6] ? XL.do : null });
  if (nk.coMat.length || !nk.yeuCau) trangBang(wb, 'NK điểm danh', null, [{ h: 'Thời gian', w: 18 }, { h: 'Người', w: 22 }, { h: 'GPS', w: 26 }, { h: 'Ảnh', w: 12 }, { h: 'Vùng định vị', w: 16 }, { h: 'Cách gửi', w: 18 }],
    nk.coMat.map(x => x.slice(0, 3).concat([linkAnh(x[3]), x[4], x[5]])));
  if (nk.yeuCau && nk.yeuCau.length) trangBang(wb, 'Yêu cầu phát sinh', null, [{ h: 'Mã', w: 13 }, { h: 'Thời gian tạo', w: 18 }, { h: 'Người tạo', w: 18 }, { h: 'Khu', w: 7, c: 1 }, { h: 'Vị trí', w: 18 }, { h: 'Loại', w: 12 }, { h: 'Mô tả', w: 36 }, { h: 'Hạn có mặt', w: 18 }, { h: 'Có mặt lúc', w: 18 }, { h: 'Xử lý xong', w: 18 }, { h: 'Nội dung xử lý', w: 26 }, { h: 'Xác nhận', w: 18 }, { h: 'Trạng thái', w: 13 }, { h: 'Trễ hạn', w: 8, c: 1 }, { h: 'Lần chưa đạt', w: 9, c: 1 }, { h: 'Ảnh', w: 12 }],
    nk.yeuCau.map(x => x.slice(0, 15).concat([linkAnh(x[15])])), { to: row => row[13] === 'Có' ? XL.do : null });
}

/* ================= NGƯỜI DÙNG ================= */
const TEN_QUYEN = { QuanTri: 'Quản trị (toàn quyền)', TaoYeuCau: 'Tạo & xác nhận yêu cầu phát sinh', ThucHien: 'Thực hiện dịch vụ (có mặt, kiểm tra, phun, xử lý yêu cầu)', KhaiTram: 'Khai báo trạm bả', NhapLich: 'Nhập lịch làm việc', XemBaoCao: 'Xem báo cáo' };
let USERS = [];
PAGES.users = async function () {
  setTitle('Người dùng');
  main(`<button class="btn btn-block" onclick="go('userForm',[null])">＋ Thêm người dùng</button><div id="dsu" class="muted">Đang tải…</div>`);
  const me = CUR; const r = await call('dsNguoiDung', {}, true); if (!r || me !== CUR) return;
  USERS = r;
  $('#dsu').innerHTML = r.map(u => `<div class="item" onclick="go('userForm',['${h(u.ten)}'])"><div class="grow"><b>${h(u.hoTen)}</b> <span class="muted">@${h(u.ten)} · ${h(u.donVi)}</span>${u.tt !== 'Hoạt động' ? ' <span class="tag t-bad">Khóa</span>' : ''}
    <div class="tags">${Object.keys(TEN_QUYEN).filter(k => u[k]).map(k => `<span class="tag">${TEN_QUYEN[k].split(' (')[0]}</span>`).join('')}</div></div><span class="chev">›</span></div>`).join('');
};
PAGES.userForm = function (ten) {
  const u = ten ? USERS.find(x => x.ten === ten) : null;
  setTitle(u ? 'Sửa người dùng' : 'Thêm người dùng');
  main(`<div class="card"><div class="fld"><label>Tên đăng nhập *</label><input id="ut" value="${h(u ? u.ten : '')}" ${u ? 'disabled' : ''} autocapitalize="off" placeholder="vd: gm.thiep"></div>
    <div class="fld"><label>Họ tên *</label><input id="uh" value="${h(u ? u.hoTen : '')}"></div>
    <div class="fld"><label>Đơn vị</label>${chips('ud', ['Bên A', 'NCC'], false, u ? u.donVi : 'NCC')}</div>
    <div class="fld"><label>Số điện thoại</label><input id="us" value="${h(u ? u.sdt : '')}" inputmode="tel"></div>
    <div class="fld"><label>Quyền</label><div class="row wrap" style="margin-bottom:8px"><button class="btn btn-o btn-s" onclick="mauQuyen(['ThucHien','KhaiTram','NhapLich'])">Mẫu NCC</button><button class="btn btn-o btn-s" onclick="mauQuyen(['TaoYeuCau'])">Mẫu người báo sự cố</button><button class="btn btn-o btn-s" onclick="mauQuyen(['TaoYeuCau','XemBaoCao'])">Mẫu giám sát Bên A</button></div>
      ${Object.keys(TEN_QUYEN).map(k => `<label class="row" style="margin-bottom:8px;font-weight:400"><input type="checkbox" class="uq" value="${k}" ${u && u[k] ? 'checked' : ''}> ${TEN_QUYEN[k]}</label>`).join('')}</div>
    <div class="fld"><label>Trạng thái</label>${chips('utt', ['Hoạt động', 'Khóa'], false, u ? u.tt : 'Hoạt động')}</div>
    <div class="fld"><label>${u ? 'Đặt lại mật khẩu (để trống nếu không đổi)' : 'Mật khẩu *'}</label><input id="up" type="text" autocomplete="off"></div>
    <button class="btn btn-block" onclick="luuUser(this,${u ? 'false' : 'true'})">Lưu</button></div>`);
};
function mauQuyen(ds) { document.querySelectorAll('.uq').forEach(c => c.checked = ds.includes(c.value)); }
async function luuUser(b, moi) {
  const p = { moi, ten: $('#ut').value, hoTen: $('#uh').value, donVi: F.ud, sdt: $('#us').value, tt: F.utt, matKhau: $('#up').value };
  document.querySelectorAll('.uq').forEach(c => p[c.value] = c.checked);
  const r = await gui(b, 'luuNguoiDung', p, 'Đã lưu');
  if (r) goBack();
}

/* ================= TÀI KHOẢN ================= */
PAGES.acc = function () {
  setTitle('Tài khoản');
  main(`<div class="card"><b>${h(APP.user.hoTen)}</b><div class="muted">@${h(APP.user.ten)} · ${h(APP.user.donVi)}</div></div>
    <div class="card"><b>Đổi mật khẩu</b><div class="fld" style="margin-top:8px"><label>Mật khẩu hiện tại</label><input id="mc" type="password"></div>
    <div class="fld"><label>Mật khẩu mới (từ 6 ký tự)</label><input id="mm" type="password"></div>
    <button class="btn" onclick="doiMK(this)">Đổi mật khẩu</button></div>
    <div class="card"><b>Tốc độ máy chủ (các lần gọi gần nhất)</b><div class="muted" style="margin-top:6px">${TOC_DO.length ? TOC_DO.slice().reverse().map(x => h(x.a) + ': ' + x.giay.toFixed(1) + ' giây').join('<br>') : 'Chưa có số liệu'}</div></div>
    <button class="btn btn-ro btn-block" onclick="dangXuat()">Đăng xuất</button>`);
};
async function doiMK(b) { const r = await gui(b, 'doiMatKhau', { cu: $('#mc').value, moi: $('#mm').value }, 'Đã đổi mật khẩu – các máy khác sẽ phải đăng nhập lại'); if (r) { TOKEN = r.token; if (LS.get('kct_token')) LS.set('kct_token', TOKEN); $('#mc').value = ''; $('#mm').value = ''; } }
function dangXuat() { TOKEN = ''; LS.del('kct_token'); LS.del('kct_app'); OFFLINE = false; BADGE_YC = 0; if (GPS_WATCH !== null && navigator.geolocation) navigator.geolocation.clearWatch(GPS_WATCH); GPS_WATCH = null; renderLogin(); }

start();
</script>
</body>
